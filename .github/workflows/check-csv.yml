name: Check CSV

# Runs the same checks as the lefthook hooks (see lefthook.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-checker:
    name: Test the CSV checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run tests on checker scripts (pre-push hook)
        run: tools/check_csv/tests/run_tests.sh

  check-csv:
    name: Check CSV structure
    needs: test-checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check CSV files (pre-commit hook)
        run: >-
          tools/check_csv/check_csv.sh
          morph_box.csv
          existing_solutions.csv
          abkuerzungen.csv
          zentrale_dienste.csv
