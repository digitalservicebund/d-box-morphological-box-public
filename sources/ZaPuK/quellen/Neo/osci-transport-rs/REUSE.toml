[[annotations]]
path = "cspell.json"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "FITKO (Föderale IT-Kooperation)"

[[annotations]]
path = ".releaserc.json"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "FITKO (Föderale IT-Kooperation)"

[[annotations]]
path = "*.jinja"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "FITKO (Föderale IT-Kooperation)"

[[annotations]]
path = ".gitlab/merge_request_templates/*.md"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "FITKO (Föderale IT-Kooperation)"

[[annotations]]
path = ".copier-answers.yml"
