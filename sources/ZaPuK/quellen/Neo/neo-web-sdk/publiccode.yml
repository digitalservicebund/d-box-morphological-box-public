description:
  en:
    shortDescription: TypeScript/WebAssembly SDK for Neo,
      the pilot project for Matrix-based G2X communication
    longDescription: >
      The TypeScript/WebAssembly bindings for the Matrix Rust SDK used by the
      web client of Neo, the Matrix-based G2X communication infrastructure
      pilot. Published as an npm package and consumed by the Neo web app.

      It includes the Rust-to-wasm bindings generation tooling, CI/CD
      workflows and documentation for building and releasing this package.
    features:
      - WebAssembly SDK
      - Matrix Rust SDK bindings
      - Markdown Linting
      - Markdown Spellchecking
      - REUSE license linting
      - Conventional Commits
      - Semantic Release
  de:
    shortDescription: TypeScript/WebAssembly-SDK für Neo,
      das Pilotproject für Matrix-basierte G2X-Kommunikation
    longDescription: >
      Die TypeScript/WebAssembly-Anbindung an das Matrix Rust SDK, die vom
      Web-Client von Neo, dem Piloten für die Matrix-basierte
      G2X-Kommunikationsinfrastruktur, genutzt wird. Veröffentlicht als
      npm-Paket und vom Neo Web Client eingebunden.

      Sie beinhaltet die Werkzeuge zur Generierung der Rust-zu-Wasm-Anbindung,
      CI/CD-Workflows und Dokumentation zum Bauen und Veröffentlichen dieses
      Pakets.
    features:
      - WebAssembly SDK
      - Matrix Rust SDK Anbindung
      - Markdown Linting
      - Markdown-Rechtschreibprüfung
      - REUSE-Lizenzprüfung
      - Conventional Commits
      - Semantic Release
