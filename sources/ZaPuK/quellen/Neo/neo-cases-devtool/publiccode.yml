description:
  en:
    shortDescription: Dev tool for creating cases to test the Neo apps
    longDescription: >
      This is a developer tool for creating and managing cases with their
      inquiries and messages in order to test the Neo web app and iOS app.
      It represents the government side of the communication, whereas the
      Neo web app and iOS app represent the citizen side.
    features:
      - Create cases and inquiries
  de:
    shortDescription: Entwickler-Tool für Vorgänge um die Neo-Apps zu testen
    longDescription: >
      Ein Entwicklertool zum Erstellen und Verwalten von Vorgängen
      mit den dazugehörigen Anfragen und Nachrichten, um die Neo-Web-App
      und die iOS-App zu testen.
      Es repräsentiert die behördliche Seite der Kommunikation, während die
      Neo-Web-App und die iOS-App die Bürgerseite repräsentieren.
    features:
      - Vorgänge und Anfragen erstellen
