apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neo-cases-devtool.name" . }}
  labels:
    {{- include "neo-cases-devtool.labels" . | nindent 4 }}
data:
  config.json: |
    {{ dict "homeservers" (required "settings.homeservers must contain at least one server" .Values.settings.homeservers) | toJson }}
