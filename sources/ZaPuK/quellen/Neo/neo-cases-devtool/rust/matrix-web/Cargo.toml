[package]
name = "neo-cases-devtool"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["js", "indexeddb", "e2e-encryption"] }
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = "thin"
