approvedGitRepositories:
  - '**'

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @matrix-g2x/neo-web-sdk is published to its own GitLab project's npm
# registry, not npmjs.org. Since neo-web-sdk is a public project, no auth
# token is needed to install from it; everything outside this scope keeps
# resolving from the default npm registry.
npmScopes:
  matrix-g2x:
    npmRegistryServer: 'https://gitlab.opencode.de/api/v4/projects/11767/packages/npm/'
