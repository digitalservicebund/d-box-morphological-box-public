apiVersion: v1
kind: Service
metadata:
  name: {{ include "neo-web.fullname" . }}
  labels:
    {{- include "neo-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "neo-web.selectorLabels" . | nindent 4 }}
