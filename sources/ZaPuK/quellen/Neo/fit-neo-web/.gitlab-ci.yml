stages:
  - pre-build
  - test
  - build
  - release
  - renovate

# Reusable rule: skip any non-renovate job when the pipeline source is a
# scheduled run. Scheduled pipelines exist solely to run Renovate and should
# not trigger the full CI (builds, tests, image packaging, etc.).
.skip_on_schedule: &skip_on_schedule
  if: '$CI_PIPELINE_SOURCE == "schedule"'
  when: never

# Cache yarn dependencies by lockfile instead of node_modules.
# On cache miss, reuse the develop branch cache read-only and extend that.
.yarn_cache: &yarn_cache
  key:
    prefix: yarn-4.18.1
    files:
      - yarn.lock
  fallback_keys:
    - yarn-4.18.1-develop
  paths:
    - .cache/yarn/

.node_dependencies:
  variables:
    YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/yarn"
    YARN_ENABLE_GLOBAL_CACHE: "false"
  cache:
    - <<: *yarn_cache
      policy: pull
  before_script:
    - npm uninstall -g yarn pnpm && npm install -g corepack && corepack install
    - yarn install --immutable

variables:
  GIT_DEPTH: 0
  RENOVATE_PLATFORM: gitlab
  RENOVATE_ENDPOINT: $CI_SERVER_URL/api/v4/
  RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
  RENOVATE_CONFIG_FILE: $CI_PROJECT_DIR/renovate.json5
  RENOVATE_REPOSITORIES: $CI_PROJECT_PATH

run_renovate:
  stage: renovate
  variables:
    DOCKER_AUTH_CONFIG: $GHCR_AUTH
  image: ghcr.io/renovatebot/renovate:44.186.7
  script:
    - renovate --token $RENOVATE_TOKEN
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

reuse-lint:
  stage: pre-build
  image:
    name: fsfe/reuse:6.3.0@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6
    entrypoint: [""]
  script:
    - reuse lint
  only:
    - merge_requests

commit-lint:
  stage: pre-build
  image: node:24
  extends: .node_dependencies
  script:
    - yarn commitlint --from="$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to="$CI_COMMIT_SHA" --verbose
  only:
    - merge_requests

markdown-lint:
  stage: pre-build
  image:
    name: davidanson/markdownlint-cli2:v0.24.0@sha256:70ead7c0352d22d04bbe612cd96b54ec591538d8f4626cafe391bb2ecf3639ca
    entrypoint: [""]
  script:
    - markdownlint-cli2 "**/*.md"
  only:
    - merge_requests

markdown-spellcheck:
  stage: pre-build
  variables:
    DOCKER_AUTH_CONFIG: $GHCR_AUTH
  image:
    name: ghcr.io/streetsidesoftware/cspell:10.0.1
    entrypoint: [""]
  script:
    - cspell-cli --no-progress --no-summary "**/*.md"
  only:
    - merge_requests

# Semantic Release
release:
  stage: release
  image: node:24
  before_script:
    - apt-get update && apt-get install -y git
    - npm install -g semantic-release
      @semantic-release/changelog
      @semantic-release/commit-analyzer
      @semantic-release/git
      @semantic-release/gitlab
      @semantic-release/release-notes-generator
      conventional-changelog-conventionalcommits@9
  script:
    - semantic-release
  rules:
    - *skip_on_schedule
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GITLAB_TOKEN: $GITLAB_RELEASE_TOKEN

.run_tests_template:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1
  extends: .node_dependencies
  script:
    # Run tests
    - yarn test
    - yarn e2e

# Run tests for branches other than develop with lockfile-based cache
run_tests:
  extends: .run_tests_template
  cache:
    - <<: *yarn_cache
      policy: pull-push
  rules:
    - *skip_on_schedule
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH != "develop"'

# Run tests with specific cache for develop branch, for later re-use of that cache
run_tests_develop:
  extends: .run_tests_template
  cache:
    - key: yarn-4.18.1-develop
      paths:
        - .cache/yarn/
      policy: pull-push
  rules:
    - *skip_on_schedule
    - if: '$CI_COMMIT_BRANCH == "develop"'

linter:
  stage: test
  image: node:24
  extends: .node_dependencies
  script:
    # Run oxlint (treat warnings as errors in CI)
    - yarn lint:ci
    # Run Oxfmt check
    - yarn format:check
  rules:
    - *skip_on_schedule
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"

# Gitlab's Kaniko fork (replacement for deprecated Google Kaniko)
# Google archived Kaniko on June 3, 2025; Gitlab maintains this fork
#
# Multi-arch build strategy:
# - build_app: Builds the web app on amd64, outputs dist/ as artifact
# - package_image_*: Package the pre-built dist/ into nginx images for each arch
# - create_manifest: Combines arch-specific images into a multi-arch manifest
#
# This approach works around Kaniko's limitation of not supporting cross-compilation
# (--custom-platform pulls images for target arch but can't execute them on amd64 runners)

# Build the web application (runs on amd64, outputs platform-independent static files)
build_app:
  stage: build
  image: node:24-bookworm
  extends: .node_dependencies
  rules:
    - *skip_on_schedule
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  script:
    # Build the application
    - yarn vite build
  artifacts:
    paths:
      - dist/
      - Dockerfile.package
    expire_in: 1 hour

# Template for Kaniko packaging jobs
.package_image_template:
  stage: build
  image:
    name: registry.gitlab.com/gitlab-ci-utils/container-images/kaniko:debug
    entrypoint: [""]
  needs:
    - job: build_app
      artifacts: true
  variables:
    HOME: /root
  rules:
    - *skip_on_schedule
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  before_script:
    - export HOME="$CI_PROJECT_DIR"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ -n "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" ] && [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
        echo "External merge request detected (from a fork). Skipping registry credential write to avoid leaking secrets."
      else
        mkdir -p "$CI_PROJECT_DIR/.docker"
        AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
        printf '{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" "$AUTH" > "$CI_PROJECT_DIR/.docker/config.json"
      fi

# Package amd64 image
package_image_amd64:
  extends: .package_image_template
  script:
    - |
      IS_EXTERNAL_MR=false
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ -n "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" ] && [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
        IS_EXTERNAL_MR=true
      fi

      BRANCH_NAME="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"

      if [ "$BRANCH_NAME" = "main" ]; then
        /kaniko/executor \
          --dockerfile=Dockerfile.package \
          --context=dir://$CI_PROJECT_DIR \
          --destination=$CI_REGISTRY_IMAGE:main-amd64 \
          --destination=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-amd64 \
          --custom-platform=linux/amd64 \
          --cache=true \
          --cache-repo=$CI_REGISTRY_IMAGE/cache-amd64 \
          --verbosity=info
      elif [ "$IS_EXTERNAL_MR" = "true" ]; then
        /kaniko/executor \
          --dockerfile=Dockerfile.package \
          --context=dir://$CI_PROJECT_DIR \
          --no-push \
          --custom-platform=linux/amd64 \
          --verbosity=info
      else
        BRANCH_TAG=$(echo "$BRANCH_NAME" | sed 's#[/ ]#-#g')
        /kaniko/executor \
          --dockerfile=Dockerfile.package \
          --context=dir://$CI_PROJECT_DIR \
          --destination=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-amd64 \
          --destination=$CI_REGISTRY_IMAGE:$BRANCH_TAG-amd64 \
          --custom-platform=linux/amd64 \
          --cache=true \
          --cache-repo=$CI_REGISTRY_IMAGE/cache-amd64 \
          --verbosity=info
      fi

# Package arm64 image
package_image_arm64:
  extends: .package_image_template
  script:
    - |
      IS_EXTERNAL_MR=false
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ -n "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" ] && [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
        IS_EXTERNAL_MR=true
      fi

      BRANCH_NAME="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"

      if [ "$BRANCH_NAME" = "main" ]; then
        /kaniko/executor \
          --dockerfile=Dockerfile.package \
          --context=dir://$CI_PROJECT_DIR \
          --destination=$CI_REGISTRY_IMAGE:main-arm64 \
          --destination=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-arm64 \
          --custom-platform=linux/arm64 \
          --cache=true \
          --cache-repo=$CI_REGISTRY_IMAGE/cache-arm64 \
          --verbosity=info
      elif [ "$IS_EXTERNAL_MR" = "true" ]; then
        /kaniko/executor \
          --dockerfile=Dockerfile.package \
          --context=dir://$CI_PROJECT_DIR \
          --no-push \
          --custom-platform=linux/arm64 \
          --verbosity=info
      else
        BRANCH_TAG=$(echo "$BRANCH_NAME" | sed 's#[/ ]#-#g')
        /kaniko/executor \
          --dockerfile=Dockerfile.package \
          --context=dir://$CI_PROJECT_DIR \
          --destination=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-arm64 \
          --destination=$CI_REGISTRY_IMAGE:$BRANCH_TAG-arm64 \
          --custom-platform=linux/arm64 \
          --cache=true \
          --cache-repo=$CI_REGISTRY_IMAGE/cache-arm64 \
          --verbosity=info
      fi

# Create multi-arch manifest combining amd64 and arm64 images
create_manifest:
  stage: build
  image: mplatform/manifest-tool:alpine@sha256:566f66687564e125c43bb86e2d035ad9b7fb4449f38814535b691d1a7f8d20db
  needs:
    - job: package_image_amd64
    - job: package_image_arm64
  rules:
    # Only create manifest when images were pushed (not for external MRs)
    - *skip_on_schedule
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: always
    - when: never
  script:
    - |
      BRANCH_NAME="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      BRANCH_TAG=$(echo "$BRANCH_NAME" | sed 's#[/ ]#-#g')

      # Create manifest for commit SHA
      manifest-tool --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
        push from-args \
        --platforms linux/amd64,linux/arm64 \
        --template "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-ARCH" \
        --target "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

      # Create manifest for branch tag
      if [ "$BRANCH_NAME" = "main" ]; then
        manifest-tool --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$CI_REGISTRY_IMAGE:main-ARCH" \
          --target "$CI_REGISTRY_IMAGE:main"
        # Also create 'latest' tag for main
        manifest-tool --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$CI_REGISTRY_IMAGE:main-ARCH" \
          --target "$CI_REGISTRY_IMAGE:latest"
      else
        manifest-tool --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" \
          push from-args \
          --platforms linux/amd64,linux/arm64 \
          --template "$CI_REGISTRY_IMAGE:$BRANCH_TAG-ARCH" \
          --target "$CI_REGISTRY_IMAGE:$BRANCH_TAG"
      fi

helm-lint:
  stage: pre-build
  image:
    name: quay.io/helmpack/chart-testing:latest@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4
  rules:
    - *skip_on_schedule
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - helm dependency update $CI_PROJECT_DIR/charts/neo-web
    - helm lint $CI_PROJECT_DIR/charts/neo-web
    - helm template $CI_PROJECT_DIR/charts/neo-web > neo-web.yaml
  artifacts:
    paths:
      - neo-web.yaml
