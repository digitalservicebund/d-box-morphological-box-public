input_dir: FITNeo/
output_dir: FITNeo/Generated/

fonts:
  inputs:
    - Resources/Fonts/
  outputs:
    - templateName: swift5
      output: Fonts+Generated.swift

strings:
  inputs:
    - Resources/Localizations/en.lproj
  outputs:
    - templateName: structured-swift5
      output: Strings+Generated.swift

xcassets:
  inputs:
    - Resources/Assets.xcassets
    - Resources/Theme.xcassets
  outputs:
    - templateName: swift5
      output: Assets+Generated.swift
      params:
        forceProvidesNamespaces: true
