[uwsgi]
module = server:app
pidfile = server.pid
socket = server.socket
chmod-socket = 666
master = true
processes = 1
buffer-size = 32768
vacuum = true
mount = /=server:app
manage-script-name = true
; If VIRTUAL_ENV is set then use its value to specify the virtualenv directory
if-env = VIRTUAL_ENV
virtualenv = %(_)
endif =
