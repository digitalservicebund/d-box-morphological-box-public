      Matrix-basierten G2X-Kommunikationsinfrastrukturpiloten "Neo" sind.

      Sie beinhaltet plattformunabhängige Werkzeuge, CI/CD-Workflows und
      Dokumentation zur Verwaltung von Software-Assets und Lieferartefakten.
    features:
      - Projektvorlage
      - Markdown Linting
      - Markdown-Rechtschreibprüfung
