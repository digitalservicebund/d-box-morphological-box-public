---
$schema: https://json-schema.org/draft/2020-12/schema

properties:
  uri:
    type: string
    pattern: ^(mxc:\/\/)?[a-zA-Z0-9\-\.]+(:[0-9]{1,5})?\/.*?$
  name:
    type: string
  mimetype:
    type: string
    pattern: ^\w+/[-+.\w]+$
  size:
    type: integer
required:
  - uri
  - name
title: File details
type: object
