---
$schema: https://json-schema.org/draft/2020-12/schema

properties:
  m.text:
    allOf:
      - $ref: m.text.yaml
      - minContains: 1
        contains:
          oneOf:
            - not:
                required:
                  - "mimetype"
            - properties:
                mimetype:
                  enum:
                    - "text/plain"
                  type: string
              required:
                - "mimetype"
required:
  - m.text
title: Plain text title
type: object
