description:
  en:
    shortDescription: SDK for matrix-based NEO applications
    longDescription: >
      Toolkit to easily integrate the case-based communication of NEO into
      Fachverfahren.

      Allows sending and retrieving encrypted messages and files.
    features:
      - End-to-End Encryption
      - Case-based communication
      - Structured Messages
  de:
    shortDescription: SDK für Matrix-basierte NEO Anwendungen
    longDescription: >
      Ein Toolkit um Fachverfahren einfach und reibungslos an die
      vorgangsbasierte Kommunikation von NEO anzubinden.

      Ermöglicht das Senden und Abrufen von verschlüsselten Nachrichten
      und Dateien.
    features:
      - Ende-zu-Ende Verschlüsselung
      - Vorgangsbasierte Kommunikation
      - Strukturierte Nachrichten
