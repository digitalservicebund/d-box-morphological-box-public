publiccodeYmlVersion: '0.5'
name: FITKO Neo Matrix SDK (JVM bindings)
url: https://gitlab.opencode.de/fitko/matrix-g2x/neo-matrix-java-sdk.git
platforms:
  - web
  - mobile
categories:
  - communications
  - digital-citizenship
