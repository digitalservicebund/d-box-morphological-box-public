apiVersion: v1
kind: Service
metadata:
  name: {{ include "neo-eid-proxy.fullname" . }}
  labels:
    {{- include "neo-eid-proxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "neo-eid-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      name: http
      targetPort: http
