apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "neo-keycloak.fullname" . }}-pullsecret
  labels:
    {{- include "neo-keycloak.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ include "neo-keycloak.fullname" . }}
    kind: SecretStore
  target:
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        labels:
          {{- include "neo-keycloak.labels" . | nindent 10 }}
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Release.Namespace }}
        property: pullsecret
