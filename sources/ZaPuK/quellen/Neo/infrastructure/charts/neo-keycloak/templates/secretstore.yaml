apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "neo-keycloak.fullname" . }}
  labels:
    {{- include "neo-keycloak.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local.:8200"
      path: {{ .Values.secretStore }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "fitko-apps-dev"
          serviceAccountRef:
            name: "default"
