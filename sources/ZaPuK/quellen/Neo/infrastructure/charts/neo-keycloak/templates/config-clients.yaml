apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neo-keycloak.fullname" . }}-clients
  labels:
    {{- include "neo-keycloak.labels" . | nindent 4 }}
data:
  MAS_ESS1_URL: {{ .Values.mas.ess1.url }}
  MAS_ESS1_REDIRECT: {{ .Values.mas.ess1.redirect }}
  MAS_ESS2_URL: {{ .Values.mas.ess2.url }}
  MAS_ESS2_REDIRECT: {{ .Values.mas.ess2.redirect }}
