apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: neo-dev-eid-proxy-imageupdater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "neo-dev-eid-proxy"
      images:
        - alias: "neo-dev-eid-proxy"
          imageName: "registry.opencode.de/fitko/matrix-g2x/bundid-eid-proxy:develop"
          commonUpdateSettings:
            updateStrategy: "digest"
          manifestTargets:
            helm:
              # update the Helm parameter `image.tag` in the application's helm values
              tag: "image.tag"
