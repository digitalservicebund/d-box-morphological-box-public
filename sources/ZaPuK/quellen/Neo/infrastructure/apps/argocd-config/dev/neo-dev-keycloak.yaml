apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neo-keycloak
  namespace: argocd
spec:
  project: fitko-apps
  source:
    repoURL: https://gitlab.opencode.de/fitko/matrix-g2x/infrastructure.git
    targetRevision: develop
    path: charts/neo-keycloak
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
      parameters:
  destination:
    server: https://kubernetes.default.svc
    namespace: neo-dev-keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
