---
extraObjects:
  external-secrets-operator:
  - |
    apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata:
      name: openbao
      namespace: "{{ $.Release.Namespace }}"
      labels:
        {{- include "element-io.ess-library.labels.common" (dict "root" $ "context" .) | nindent 4 }}
    spec:
      provider:
        vault:
          server: "http://openbao-active.openbao.svc.cluster.local.:8200"
          path: "services/fitko-apps-dev/secret"
          version: "v2"
          auth:
            kubernetes:
              mountPath: "kubernetes"
              role: fitko-apps-dev
              serviceAccountRef:
                name: "default"
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: openbao
      namespace: "{{ $.Release.Namespace }}"
      labels:
        {{- include "element-io.ess-library.labels.common" (dict "root" $ "context" .) | nindent 4 }}
    spec:
      refreshInterval: "15s"
      secretStoreRef:
        name: openbao
        kind: SecretStore
      target:
        name: openbao
      data:
      - secretKey: oidc.yaml
        remoteRef:
          key: "{{ $.Release.Namespace }}"
          property: oidc.yaml
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None
          nullBytePolicy: Ignore
