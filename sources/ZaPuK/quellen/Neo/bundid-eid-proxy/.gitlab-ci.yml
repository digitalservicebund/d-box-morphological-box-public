stages:
  - pre-build
  - build
  - release
  - renovate

variables:
  GIT_DEPTH: 0
  RENOVATE_PLATFORM: gitlab
  RENOVATE_ENDPOINT: $CI_SERVER_URL/api/v4/
  RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
  RENOVATE_CONFIG_FILE: $CI_PROJECT_DIR/renovate.json5
  RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/keycloak

run_renovate:
  stage: renovate
  image: renovate/renovate:42.92.5
  script:
    - renovate --token $RENOVATE_TOKEN
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

reuse-lint:
  stage: pre-build
  image:
    name: fsfe/reuse:6.2.0
    entrypoint: [""]
  script:
    - reuse lint
  only:
    - merge_requests

commit-lint:
  stage: pre-build
  image: node:24
  script:
    - npm install --no-save @commitlint/{cli,config-conventional}
    - npx commitlint --from=$CI_MERGE_REQUEST_DIFF_BASE_SHA --to=$CI_COMMIT_SHA --verbose
  only:
    - merge_requests

markdown-lint:
  stage: pre-build
  image:
    name: davidanson/markdownlint-cli2:v0.20.0
    entrypoint: [""]
  script:
    - markdownlint-cli2 "**/*.md"
  only:
    - merge_requests

markdown-spellcheck:
  stage: pre-build
  image:
    name: ghcr.io/streetsidesoftware/cspell:9.4.0
    entrypoint: [""]
  script:
    - cspell-cli --no-progress --no-summary "**/*.md"
  only:
    - merge_requests

# Semantic Release
release:
  stage: release
  image: node:24
  before_script:
    - apt-get update && apt-get install -y git
    - npm install -g semantic-release
      @semantic-release/changelog
      @semantic-release/commit-analyzer
      @semantic-release/git
      @semantic-release/gitlab
      @semantic-release/release-notes-generator
      conventional-changelog-conventionalcommits
  script:
    - semantic-release
  only:
    # Only run on protected branches
    - main

docker_build:
  stage: build
  image:
    name: registry.gitlab.com/gitlab-ci-utils/container-images/kaniko:debug
    entrypoint: [ "" ]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Containerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
