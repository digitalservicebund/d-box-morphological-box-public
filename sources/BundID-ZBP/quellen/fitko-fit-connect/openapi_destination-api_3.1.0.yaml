      description: Schalter für die Steuerung des vereinfachten Routings (ausschließlich) in der FIT-Connect Testumgebung. Der Zustellpunkt wird über das vereinfachte Routing nur dann gefunden, wenn das Feld den Wert `true` hat. Diese Steuerung befindet sich in Vorbereitung und wird erst in Zukunft aktiviert.
