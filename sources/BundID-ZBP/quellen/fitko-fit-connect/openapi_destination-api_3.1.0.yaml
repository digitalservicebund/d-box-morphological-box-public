openapi: 3.1.0
info:
  version: 3.1.0
  title: FIT-Connect Destination API V3
  description: Diese API dient dem Verwalten von Zustellpunkten.
  contact:
    name: FITKO
    url: https://docs.fitko.de/fit-connect/contact
  license:
    url: https://creativecommons.org/licenses/by-sa/4.0/
    name: Creative Commons Attribution Share Alike 4.0 (CC BY-SA 4.0)
  termsOfService: https://docs.fitko.de/fit-connect/docs/details/terms-of-use-testing/
servers:
  - url: https://test.fit-connect.fitko.dev/destination-api
    description: Testumgebung
  - url: https://stage.fit-connect.fitko.net/destination-api
    description: Stageumgebung
  - url: https://prod.fit-connect.fitko.net/destination-api
    description: Produktivumgebung
externalDocs:
  description: FIT-Connect-Dokumentationsportal mit Dokumentation zur API-Nutzung
  url: https://docs.fitko.de/fit-connect
paths:
  /v3/destinations:
    get:
      operationId: get-my-destinations
      summary: Eigene Zustellpunkte auflisten
      description: |
        Mit diesem Request können alle selbst angelegten Zustellpunkte sowie deren Konfigurationen abgerufen werden. Die Einträge haben eine stabile, aber nicht näher spezifizierte Reihenfolge.
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      parameters:
        - $ref: '#/components/parameters/minimal'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination-list'
              examples:
                Empty List:
                  $ref: '#/components/examples/destination-list-empty'
                Several Destinations:
                  $ref: '#/components/examples/destination-list'
        default:
          $ref: '#/components/responses/detailed-error'
    post:
      operationId: create-destination
      summary: Zustellpunkt anlegen
      description: |
        Dient dem Anlegen eines neuen Zustellpunktes mit entsprechender Konfiguration zum Empfang von Einreichungen. Ein detaillierte Beschreibung ist in der [Dokumentation](https://docs.fitko.de/fit-connect/docs/getting-started/receiving/destination) zu finden.
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-destination'
            examples:
              Beispiel:
                $ref: '#/components/examples/create-destination'
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
            Location:
              $ref: '#/components/headers/location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination-private'
              examples:
                Beispiel:
                  $ref: '#/components/examples/destination-private'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/destinations/{destinationId}:
    parameters:
      - $ref: '#/components/parameters/destinationId'
    get:
      operationId: get-destination-info
      summary: Zustellpunkt abfragen
      description: Ruft die Details eines Zustellpunktes ab.
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination-private'
              examples:
                Beispiel:
                  $ref: '#/components/examples/destination-private'
        default:
          $ref: '#/components/responses/detailed-error'
    put:
      operationId: update-destination
      summary: Zustellpunkt speichern
      description: |
        Ermöglicht es, einen Zustellpunkt vollständig zu aktualisieren bzw überschreiben.
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/destination-put'
            examples:
              Beispiel:
                $ref: '#/components/examples/update-destination'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination-private'
              examples:
                Beispiel:
                  $ref: '#/components/examples/destination-private'
        default:
          $ref: '#/components/responses/detailed-error'
    patch:
      operationId: patch-destination
      summary: Zustellpunkt partiell aktualisieren
      description: |
        Ermöglicht es einen Zustellpunkt partiell zu aktualisieren. Ein Beispiel wäre die Änderung des Feldes `encryptionKid` bei Schlüssel-Rollover.
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/destination-patch'
            examples:
              Patch Status:
                $ref: '#/components/examples/patch-destination-status'
              Patch Contact:
                $ref: '#/components/examples/patch-destination-contact'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination-private'
              examples:
                Beispiel:
                  $ref: '#/components/examples/destination-private'
        default:
          $ref: '#/components/responses/detailed-error'
    delete:
      operationId: delete-destination
      summary: Zustellpunkt löschen
      description: Dieser Endpunkt ermöglicht es, einen Zustellpunkt zu löschen, solange sich dieser im status 'created' befindet.
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
      responses:
        '204':
          description: Zustellpunkt erfolgreich gelöscht.
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/destinations/{destinationId}/keys:
    parameters:
      - $ref: '#/components/parameters/destinationId'
    get:
      operationId: list-destination-keys
      summary: Liste aller öffentlichen Schlüssel eines Zustellpunktes
      description: Alle einem Zustellpunkt zugeordneten öffentlichen Schlüssel werden über diesen Endpunkt im JWKS [RFC7517](https://datatracker.ietf.org/doc/html/rfc7517#section-5) Format gelistet.
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jwks-with-paging'
              examples:
                Beispiel:
                  $ref: '#/components/examples/jwks-with-paging'
        default:
          $ref: '#/components/responses/detailed-error'
    post:
      operationId: add-destination-key
      summary: Fügt dem Zustellpunkt einen JWK hinzu.
      description: Um einem Zustellpunkt verschlüsselte Datensätze zu schicken benötigt man dessen öffentlichen Schlüssel. Diesen Schlüssel kann man als Verwalter eines Zustellpunktes über diesen Endpunkt setzen.
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jwk'
            examples:
              Beispiel Signatur-Public-Key:
                $ref: '#/components/examples/jwk-verify'
              Beispiel Verschlüsselungs-Public-Key:
                $ref: '#/components/examples/jwk-wrapKey'
      responses:
        '201':
          description: Schlüssel hinzugefügt oder existiert bereits
          headers:
            Location:
              $ref: '#/components/headers/location'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/destinations/{destinationId}/limits:
    parameters:
      - $ref: '#/components/parameters/destinationId'
    get:
      operationId: get-destination-limits
      summary: Destination-Limits abfragen
      description: Ruft die Attachment-Limits einer Destination ab.
      tags:
        - Destination Attachment Limits Verwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-all
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attachment-limit-response'
              examples:
                Beispiel:
                  $ref: '#/components/examples/attachment-limit-response'
        default:
          $ref: '#/components/responses/detailed-error'
    patch:
      operationId: request-destination-limit-change
      summary: Destination-Limit-Änderung beantragen
      description: |
        Reicht einen Antrag auf Veränderung ein, ändert den bestehenden Antrag oder nimmt den Antrag zurück, je nach 'status'.
        Soll ein Antrag zurückgenommen werden, genügt es, das 'status'-Feld mit dem Wert 'WITHDRAWN' zu senden.
        Soll ein Antrag auf Veränderung gestellt werden, müssen die Felder unter 'values' gesendet werden, ein 'reason' muss
        angegeben werden und das 'status'-Feld muss den Wert 'PENDING' haben. Die Angabe von 'contactEmail' ist optional
        und dient dazu, eine Benachrichtigung über den Ausgang des Antrags zuzustellen. Ein neuer Antrag überschreibt
        stets einen unter Umständen bestehenden offenen Antrag.
      tags:
        - Destination Attachment Limits Verwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/attachment-limit-request'
            examples:
              Beispiel:
                $ref: '#/components/examples/attachment-limit-request'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attachment-limit-response'
              examples:
                Beispiel:
                  $ref: '#/components/examples/attachment-limit-response'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/destinations/{destinationId}/keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/destinationId'
      - $ref: '#/components/parameters/keyId'
    get:
      operationId: get-destination-key
      summary: Ruft einen JWK des Zustelldienstes ab
      description: Ermöglicht es, Public Keys eines Zustellpunktes abzufragen.
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jwk'
              examples:
                Beispiel Signatur-Public-Key:
                  $ref: '#/components/examples/jwk-verify'
                Beispiel Verschlüsselungs-Public-Key:
                  $ref: '#/components/examples/jwk-wrapKey'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/info:
    get:
      operationId: get-info
      summary: Rufe die Version der bereitgestellten Destination API ab
      description: Für Debugging oder Informationszwecke angebotener Endpunkt
      tags:
        - Fachlich
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/info'
              examples:
                Beispiel:
                  $ref: '#/components/examples/info'
        default:
          $ref: '#/components/responses/detailed-error'
  /.well-known/jwks.json:
    get:
      operationId: get-jwks.json
      summary: Rufe die öffentlichen Schlüssel des Zustelldienstes ab
      description: Vom Zustelldienstes signierte Datensätze können mit einem dieser Schlüssel signiert werden.
      tags:
        - Fachlich
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jwks'
              examples:
                Beispiel:
                  $ref: '#/components/examples/jwks-verify'
        default:
          $ref: '#/components/responses/detailed-error'
components:
  securitySchemes:
    OAuth2:
      description: Authentifizierungsmethode, um den Zugriff nach RFC8725 zu autorisieren
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth-testing.fit-connect.fitko.dev/token
          scopes:
            https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations: Erlaubt das Anlegen, Lesen, Verändern und Löschen von Zustellpunkten
  parameters:
    destinationId:
      name: destinationId
      in: path
      description: Die UUID des Zustellpunktes
      required: true
      schema:
        $ref: '#/components/schemas/destination-id'
    minimal:
      name: minimal
      in: query
      description: Beschränkt die zurückgegebenen Felder einer Destination auf destinationId, name, status.
      required: false
      schema:
        type: boolean
    status:
      name: status
      in: query
      description: Filtert Destinations nach Status (Mehrfachangabe möglich wie z.B. ?status=created&status=draft). Destinations aller Zustände werden zurückgegeben, wenn der Parameter weggelassen wird.
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/destination-status'
    search:
      name: search
      in: query
      description: Durchsucht destinationId und name nach diesem Freitext. Die Suche ist dabei fuzzy ("string.contains(search)") und case-insensitive.
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Anzahl der zurückzugebenden Ergebnisse. Maximum ist 500. Standard ist 100.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
    offset:
      name: offset
      in: query
      description: Startposition der Teilmenge zurückzugebender Ergebnisse aus der Gesamtergebnismenge. Standard ist 0.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 36
      description: Die Id eines JWK
  schemas:
    ContactInformation:
      $ref: '#/components/schemas/contact-information'
    CreateCallback:
      $ref: '#/components/schemas/create-callback'
    CreateDestination:
      $ref: '#/components/schemas/create-destination'
    DestinationSimpleList:
      $ref: '#/components/schemas/destination-list'
    PrivateDestination:
      $ref: '#/components/schemas/destination-private'
    DestinationId:
      $ref: '#/components/schemas/destination-id'
    DestinationName:
      $ref: '#/components/schemas/destination-name'
    DestinationPublicService:
      $ref: '#/components/schemas/destination-service'
    JWK:
      $ref: '#/components/schemas/jwk'
    JWKS:
      $ref: '#/components/schemas/jwks'
    SupportedMetadataVersions:
      $ref: '#/components/schemas/supported-metadata-versions'
    PatchDestination:
      $ref: '#/components/schemas/destination-patch'
    destination-status:
      type: string
      enum:
        - draft
        - created
        - active
        - inactive
        - decommissioned
      description: Status des Zustellpunktes. Eine Beschreibung der Status finden Sie in den Detailinformationen unter [Zustellpunktverwaltung](https://docs.fitko.de/fit-connect/docs/details/destination-management).
    destination-id:
      type: string
      format: uuid
      minLength: 32
      maxLength: 36
      description: Identifikator des Zustellpunktes im Format einer UUID
    supported-metadata-versions:
      title: Liste unterstützter Metadatenschemataversionen
      description: Eine Liste unterstützter Versionen des Metadatenschemas gemäß [Semantic Versioning](https://semver.org/).
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
        example: 1.1.1
    service-region:
      title: Region
      type: string
      description: Amtlicher Regionalschlüssel (ARS), vorangestellt mit 'DE'.
      minLength: 2
      maxLength: 14
      pattern: ^DE[0-9]{0,12}$
      example: DE094750156156
    submission-schema:
      title: Fachdatenschema
      description: Referenz auf ein Schema, das die Struktur der Fachdaten einer Einreichung beschreibt.
      type: object
      properties:
        mimeType:
          type:
            - 'null'
            - string
          description: Mimetype (z.B. application/json oder application/xml) des referenzierten Schemas (z.B. XSD- oder JSON-Schema).
          enum:
            - application/json
            - application/xml
        schemaUri:
          type:
            - 'null'
            - string
          format: uri
          description: URI des Fachschemas. Wird hier eine URL verwendet, sollte das Schema unter der angegebenen URL abrufbar sein. Eine Verfügbarkeit des Schemas unter der angegebenen URL darf jedoch nicht vorausgesetzt werden.
    reply-channels:
      type:
        - object
        - 'null'
      description: |
        Hier kann eine empfangende Stelle angeben, welche Rückkanäle es für Einreichungen an diesen Zustellpunkt unterstützt. Sofern keine Reply Channels angegeben werden, kann ein sendendes System davon ausgehen, dass die Behörde nur über den Papierweg im Rückkanal kommuniziert.
      minProperties: 1
      properties:
        eMail:
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per E-Mail unterstützt.
          type: object
          properties:
            usePgp:
              type: boolean
              description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für die Rückkanalkommunikation per E-Mail eine Verschlüsselung mit PGP unterstützt, sofern eine PGP Schlüssel über die Metadaten der Einreichung oder einen anderen Mechanismus übermittelt wurden.
        deMail:
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per DE-Mail unterstützt.
        fink:
          deprecated: true
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation an die interoperablen Postfächer der FINK Föderation unterstützt.
        elster:
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per Elster-Transfer unterstützt.
        fitConnect:
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per FIT-Connect unterstützt.
          required:
            - processStandards
          properties:
            processStandards:
              description: |
                Hier ist eine eindeutige Referenz auf den zu verwendenden Datenaustauschstandard (einschließlich der Version) mittels der offiziellen URI des Datenaustauschstandards zu hinterlegen.
              type: array
              minItems: 1
              items:
                type: string
                format: uri
        idBundDeMailbox:
          type: object
          description: Hiermit kann dem Onlinediensten signalisiert werden, dass das Verwaltungssystem das zentrale Bürgerpostfach der DeutschlandID unterstützt.
          required:
            - useStatusMonitor
          properties:
            useStatusMonitor:
              type: boolean
              description: Hiermit signalisiert das Verwaltungssystem, dass es den Statusmmonitor der DeutschlandID nutzt und der Onlinedienst einen Status anlegen darf.
    destination-service:
      title: Verwaltungsleistung
      description: Verwaltungsleistung, die eine Destination anbietet.
      type: object
      properties:
        identifier:
          title: Leistungs-Identifikator
          description: |
            URN einer Leistung. Im Falle einer Leistung aus dem Leistungskatalog sollte hier `urn:de:fim:leika:leistung:` vorangestellt werden.
          type:
            - 'null'
            - string
          minLength: 7
          maxLength: 255
          pattern: ^urn:[a-z0-9][a-z0-9-]{0,31}:[a-z0-9()+,.:=@;$_!*'%/?#-]+$
          example: urn:de:fim:leika:leistung:99400048079000
        regions:
          description: Amtliche Regionalschlüssel (ARS) der Regionen in denen die Leistung angeboten wird. Vorangestellt mit 'DE'.
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/service-region'
        submissionSchemas:
          title: Unterstützte Fachschemata
          description: Auflistung aller unterstützten Fachschemata des Zustellpunktes.
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/submission-schema'
        replyChannels:
          $ref: '#/components/schemas/reply-channels'
    process-model-id:
      title: Prozessreferenz
      description: |
        URI einer Prozessdefinition, z.B. `https://schema.example.com/foo/bar.bpmn` oder `bpmn:960116c1-f862-4060-beaa-f99e410f8325:v2`.
      type: string
      format: uri
      maxLength: 512
      example: https://schema.example.com/foo/bar.bpmn
    message-id:
      title: Prozessschritt
      description: |
        ID eines Prozessschrittes innerhalb des durch `processModelId` definierten Prozesses.
      type: string
      maxLength: 255
      example: 172ff473-ef69-4ce6-a8d6-a50308e355e3
    destination-process-message:
      title: Prozessverarbeitungsleistung
      description: Auflistung der unterstützten Prozessnachrichten des Zustellpunktes.
      type: object
      properties:
        processModelId:
          $ref: '#/components/schemas/process-model-id'
        messageId:
          $ref: '#/components/schemas/message-id'
        regions:
          description: Amtliche Regionalschlüssel (ARS) der Regionen, für die eine Prozessverarbeitung angeboten wird. Vorangestellt mit 'DE'.
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/service-region'
        schemas:
          title: Unterstützte Schemas
          description: Auflistung aller unterstützten Schemas des Zustellpunktes für diese Prozessnachricht.
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/submission-schema'
    destination-type:
      type: string
      enum:
        - A
        - B
        - C
      description: Der Typ eines Zustellpunktes (erforderlich)
    destination-possible-next-status:
      type: array
      items:
        $ref: '#/components/schemas/destination-status'
      minItems: 0
      description: Eine Liste von möglichen nächsten Status des Zustellpunktes, ausgehend vom aktuellen Zustand des Zustellpunktes. Eine Beschreibung der Status finden Sie in den Detailinformationen unter [Zustellpunktverwaltung](https://docs.fitko.de/fit-connect/docs/details/destination-management).
    destination-can-be-decomissioned-at:
      type: string
      format: date-time
      description: Frühstmöglicher Zeitpunkt, an dem der Zustellpunkt auf 'decommissioned' gesetzt werden darf.
      example: '2024-03-20T09:12:28Z'
    destination-name:
      type:
        - 'null'
        - string
      minLength: 0
      maxLength: 128
      description: Name des Zustellpunktes
    contact-information:
      title: Kontakt
      description: Angaben zum Ansprechpartner des Zustellpunktes
      type:
        - object
        - 'null'
      properties:
        legalName:
          type: string
          description: Juristischer Name der verantwortlichen Organisation
          example: Max Mustermann
        address:
          type: string
          description: Adresse der verantwortlichen Organisation
        phone:
          type: string
          description: Telefonnummer der verantwortlichen Stelle
        email:
          type: string
          format: email
          description: E-Mail-Adresse der verantwortlichen Stelle (Funktionspostfach). Falls kein Funktionspostfach vorhanden ist, kann auch eine personalisierte Adresse des Supportverantwortlichen eingetragen werden.
          example: Max@Mustermann.de
        cc:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Optionale Liste zusätzlicher E-Mail-Adressen (CC), die bei Benachrichtigungen zum Zustellpunkt zusätzlich zum technischen Ansprechpartner (`email`) einbezogen werden. Damit können z. B. externe Stellen wie der Support eines Fachverfahrensherstellers in die Benachrichtigungen einbezogen werden.
          items:
            type: string
            format: email
          example:
            - support@dienstleister.not
            - team@mustermann.not
        unit:
          type: string
          description: Verantwortliche Untereinheit (Abteilung, Referat, etc.) der Organisation. Kann zur Vereinfachung von Klärungsfragen angegeben werden.
    callback-url:
      title: Konfiguration des eingerichteten Callbacks
      type: object
      properties:
        url:
          title: Callback-URL
          description: Öffentlich erreichbare Callbackadresse, um Benachrichtigungen durch den Zustelldienst zu empfangen. Muss eine valide HTTPS-URL sein.
          type: string
          minLength: 9
          format: uri
          pattern: ^https://.+
    client-id:
      type: string
      format: uuid
      minLength: 32
      maxLength: 36
      description: Die UUID eines Clients
    destination-sender-access-restricted:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: |
            Gibt an, ob das Senden an diesen Zustellpunkt beschränkt ist oder nicht.
            Falls `true` dürfen ausschließlich Clients, deren ID in `allowedSenders` enthalten ist,
            **oder** Destinations, deren ID in `allowedSenderDestinations` enthalten ist,
            an diesen Zustellpunkt senden.
        allowedSenders:
          deprecated: true
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/client-id'
          description: |
            **Deprecated.** Auflistung der Client-IDs, die an diesen Zustellpunkt senden dürfen.
            Die Clients müssen existieren und vom Typ `SENDER` sein.

            Über V3 können bestehende Einträge entfernt werden, aber keine neuen Client-IDs hinzugefügt werden.
            Für neue Sendebeschränkungen sollte stattdessen `allowedSenderDestinations` verwendet werden.
          minItems: 0
        allowedSenderDestinations:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/destination-id'
          description: |
            Auflistung der Destination-IDs, die an diesen Zustellpunkt senden dürfen.
            In GET-Antworten ist dieses Feld immer vorhanden (ggf. als leeres Array).
          minItems: 0
    destination-signature:
      type: string
      description: Signatur des Zustellpunktes, siehe https://docs.fitko.de/fit-connect/docs/sending/get-destination/#checkDestinationSignature. Diese Signature wird nur für Zustellpunkte außerhalb des 'draft' Status berechnet und zurückgegeben.
    destination-public-for-routing:
