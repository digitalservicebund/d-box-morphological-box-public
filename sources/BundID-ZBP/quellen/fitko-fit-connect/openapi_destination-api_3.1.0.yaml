        enum:
          - '*'
  responses:
    detailed-error:
      description: |
        Fehler! Generell ist bei ungültigen Anfragen mit jedem HTTP Statuscode aus dem Bereich 4xx zu rechnen - entsprechend dem HTTP-Standard. Insbesondere treten Statuscodes 400, 401, 403, 404, 405, 406, 413, 422 und 429 auf, aber dies ist keine vollständige Auflistung. Ebenso sind Fehler des 5xx-Bereichs möglich bei schweren Fehlern auf Seiten FIT-Connects. API-Clients sollten gemäß RFC 7231 so implementiert sein, dass auch unbekannte HTTP Statuscodes gemäß ihrer Statusklasse (Axx, A=[1,5]) interpretiert werden können. Näheres zum Fehler entnehmen Sie dem HTTP-Body. Dabei kann das Feld "type" verwendet werden, um Fehlerklassen programmatisch zu behandeln. Alle weiteren Felder dienen in erster Linie zur besseren Verständlichkeit des Fehlers.
      content:
        application/problem+json:
          schema:
            title: Fehler
            type: object
            description: Der Inhalt von HTTP Responses bei Fehlern nach RFC7807.
            required:
              - type
              - title
              - status
            properties:
              type:
                type: string
                description: Eine URI-Referenz, die den Problemtyp identifiziert.
              title:
                type: string
                description: Eine kurze, von Menschen lesbare Zusammenfassung des Problems.
              status:
                type: integer
                description: Der HTTP-Statuscode der vom Ursprungsserver für dieses Auftreten des Problems generiert wurde.
                minimum: 400
                maximum: 599
              detail:
                type: string
                description: Eine von Menschen lesbare Erklärung speziell für dieses Auftreten des Problems.
              instance:
                type: string
                format: uri
                description: |
                  Eine URI-Referenz, die das spezifische Auftreten des Problems identifiziert. Sie kann, muss aber nicht, weitere Informationen liefern, wenn sie dereferenziert wird.
              errorcode:
                type: string
                description: Eine eindeutige ID dieses Fehlerfalls, die bei Support-Anfragen hilfreich sein kann.
              violations:
                type: array
                description: Bei nicht-schemakonformen Requests finden sich hier in der Regel Details zu abgelehnten Datenfeldern.
                items:
                  type: string
          example:
            type: https://schema.fitko.de/fit-connect/submission-api/problems/destination-not-found
            title: Destination not found
            status: 404
            detail: Destination 311b8787-6930-4cd7-938f-3fa1816e25aa does not exist.
            errorcode: 3af7651916cd43dd8448eb211c80319c
