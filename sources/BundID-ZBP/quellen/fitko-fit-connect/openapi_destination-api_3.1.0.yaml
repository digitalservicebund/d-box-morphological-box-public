          example: '2024-03-21T09:12:28Z'
    attachment-limit-response:
      type: object
      required:
        - attachments
      properties:
        attachments:
          type: object
          description: |
            'platform' gibt eine fundamentale Limitierung an, die auch durch Anträge nicht überschritten werden kann.
            'receive.current' gibt das aktuell für die Destination gültige Limit an (bezogen auf das Senden an diese Destination).
            'receive.changeRequest' beschreibt, falls gesetzt, den letzten Antrag auf Veränderung (bezogen auf das Senden an diese Destination).
            'send.current' gibt das aktuell für die Destination gültige Limit an (bezogen auf das Senden von dieser Destination).
            'send.changeRequest' beschreibt, falls gesetzt, den letzten Antrag auf Veränderung (bezogen auf das Senden von dieser Destination).
          required:
            - platform
            - receive
            - send
          properties:
            platform:
              type: object
              $ref: '#/components/schemas/attachment-limit-tuple'
            receive:
              type: object
              required:
                - current
              properties:
                current:
                  type: object
                  $ref: '#/components/schemas/attachment-limit-tuple'
                changeRequest:
                  type: object
                  $ref: '#/components/schemas/attachment-limit-change-request-overview'
              description: Limit, das gilt, wenn an diese Destination Attachments gesendet werden.
            send:
              type: object
              required:
                - current
              properties:
                current:
                  type: object
                  $ref: '#/components/schemas/attachment-limit-tuple'
                changeRequest:
                  type: object
                  $ref: '#/components/schemas/attachment-limit-change-request-overview'
              description: Limit, das gilt, wenn von dieser Destination Attachments gesendet werden.
    attachment-limit-change-request:
      type: object
      required:
        - status
      properties:
        values:
          type: object
          $ref: '#/components/schemas/attachment-limit-tuple'
        contactEmail:
          type: string
          format: email
          description: E-Mail-Adresse eines Ansprechpartners, der über das Ergebnis der Beantragung informiert werden möchte.
          example: Max@Mustermann.de
        requestReason:
          type: string
          description: Kurze Begründung dazu, warum eine Anhebung der Limitierung gewünscht ist.
        status:
          type: string
          enum:
            - PENDING
            - WITHDRAWN
          description: PENDING für neue Anträge oder zum Editieren eines bestehenden Antrags. WITHDRAWN zum Zurücknehmen.
    attachment-limit-request:
      type: object
      required:
        - attachments
      properties:
        attachments:
          type: object
          properties:
            receive:
              type: object
              required:
                - changeRequest
              properties:
                changeRequest:
                  type: object
                  $ref: '#/components/schemas/attachment-limit-change-request'
              description: Limit, das gilt, wenn an diese Destination Attachments gesendet werden.
            send:
              type: object
              required:
                - changeRequest
              properties:
                changeRequest:
                  type: object
                  $ref: '#/components/schemas/attachment-limit-change-request'
              description: Limit, das gilt, wenn von dieser Destination Attachments gesendet werden.
