  responses:
    detailed-error:
      description: |
        Fehler! Generell ist bei ungültigen Anfragen mit jedem HTTP Statuscode aus dem Bereich 4xx zu rechnen - entsprechend dem HTTP-Standard. Insbesondere treten Statuscodes 400, 401, 403, 404, 405, 406, 409, 413, 422 und 429 auf, aber dies ist keine vollständige Auflistung. Ebenso sind Fehler des 5xx-Bereichs möglich bei schweren Fehlern auf Seiten FIT-Connects. API-Clients sollten gemäß RFC 7231 so implementiert sein, dass auch unbekannte HTTP Statuscodes gemäß ihrer Statusklasse (Axx, A=[1,5]) interpretiert werden können. Näheres zum Fehler entnehmen Sie dem HTTP-Body. Dabei kann das Feld "type" verwendet werden, um Fehlerklassen programmatisch zu behandeln. Alle weiteren Felder dienen in erster Linie zur besseren Verständlichkeit des Fehlers.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          example:
            type: https://schema.fitko.de/fit-connect/submission-api/problems/destination-not-found
            title: Destination not found
            status: 404
            detail: Destination 311b8787-6930-4cd7-938f-3fa1816e25aa does not exist.
            errorcode: 3af7651916cd43dd8448eb211c80319c
    conflict:
      description: |
        Conflict: Der Zustand der Einreichung bzw. der Antwort erlaubt die angeforderte Zustandsänderung nicht.
        Über das Feld `type` lässt sich der Fall programmatisch unterscheiden:

        * `https://schema.fitko.de/fit-connect/submission-api/problems/submission-expired` - die Einreichung wurde
          nach Ablauf der vom Sender gesetzten Frist (`timeToLive`) bereits automatisch zurückgewiesen.
        * `https://schema.fitko.de/fit-connect/submission-api/problems/reply-expired` - dasselbe für eine Antwort.
        * `https://schema.fitko.de/fit-connect/submission-api/problems/invalid-state-transition` - der Zustand lässt
          die angeforderte Änderung aus anderen Gründen nicht zu, beispielsweise nach Ablauf der betrieblich
          konfigurierten globalen Auto-Reject-Frist.
        * `https://schema.fitko.de/fit-connect/submission-api/problems/update-conflict` - eine gleichzeitige
          Änderung derselben Einreichung bzw. Antwort ist zuvorgekommen, z. B. die automatische Zurückweisung.
          Der aktuelle Zustand ist dem Event Log zu entnehmen.

        Der genaue Zeitpunkt der automatischen Zurückweisung ist dem `reject-submission`- bzw.
        `reject-reply`-Event im Event Log des Vorgangs zu entnehmen (`GET /v3/cases/{caseId}/events`).
        Die Auflistung ist nicht abschließend.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          examples:
            submission-expired:
              summary: Einreichung nach Ablauf der vom Sender gesetzten Frist zurückgewiesen
              value:
                type: https://schema.fitko.de/fit-connect/submission-api/problems/submission-expired
                title: Submission expired
                status: 409
                detail: Submission ce75a6b8-d72f-4b94-b09e-af6be35bc2ae was automatically rejected at 2026-09-01T14:23:05Z, after the time to live set by the sender had elapsed.
                errorcode: 3af7651916cd43dd8448eb211c80319c
            reply-expired:
              summary: Antwort nach Ablauf der vom Sender gesetzten Frist zurückgewiesen
              value:
                type: https://schema.fitko.de/fit-connect/submission-api/problems/reply-expired
                title: Reply expired
                status: 409
                detail: Reply 0b1c9d4e-6f2a-4c35-8e7b-2d9a51f3c8e0 was automatically rejected at 2026-09-01T14:23:05Z, after the time to live set by the sender had elapsed.
                errorcode: 3af7651916cd43dd8448eb211c80319c
            invalid-state-transition:
              summary: Zustandsänderung aus anderen Gründen nicht zulässig
              value:
                type: https://schema.fitko.de/fit-connect/submission-api/problems/invalid-state-transition
                title: Invalid state transition
                status: 409
                detail: Cannot transition submission from REJECTED to ACCEPTED.
                errorcode: 3af7651916cd43dd8448eb211c80319c
            update-conflict:
              summary: Gleichzeitige Änderung derselben Einreichung bzw. Antwort
              value:
                type: https://schema.fitko.de/fit-connect/submission-api/problems/update-conflict
                title: Update Conflict
                status: 409
                detail: A concurrent update caused a conflict with your request
                errorcode: 8019f4dc21e355191b5891b053ce7975
    unprocessable-entity:
      description: |
