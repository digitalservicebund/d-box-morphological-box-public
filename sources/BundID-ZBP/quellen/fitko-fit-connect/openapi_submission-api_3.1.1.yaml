openapi: 3.1.0
info:
  version: 3.1.1
  title: Submission API V3
  description: |
    Die FIT-Connect Submission API ermöglicht das Einreichen von Anträgen und Berichten aus vorgelagerten Systemen (z. B. Onlineantragsdiensten, Fachportalen oder Berichtssystemen) an die Systeme der Verwaltung zur elektronischen Verfahrensbearbeitung (z. B. Fachverfahren, Dokumentenmanagementsysteme oder Prozessplattformen).
  contact:
    name: FITKO
    url: https://docs.fitko.de/fit-connect/contact
  license:
    url: https://creativecommons.org/licenses/by-sa/4.0/
    name: Creative Commons Attribution Share Alike 4.0 (CC BY-SA 4.0)
  termsOfService: https://docs.fitko.de/fit-connect/docs/details/terms-of-use-testing/
servers:
  - url: https://submission-api-testing.fit-connect.fitko.dev
    description: FIT-Connect Testumgebung
tags:
  - name: Einreichungsübermittlung
    description: Diese Gruppe enthält alle Endpunkte, die für das Versenden von Einreichungen an einen Zustellpunkt notwendig sind.
    externalDocs:
      url: https://docs.fitko.de/fit-connect/docs/getting-started/sending/overview
  - name: Einreichungsempfang
    description: Diese Gruppe umfasst alle Endpunkte, die für den Empfang und die Abfrage von Einreichungen notwendig sind.
    externalDocs:
      url: https://docs.fitko.de/fit-connect/docs/getting-started/receiving/overview
  - name: Antwort senden
    description: Diese Gruppe umfasst alle Endpunkte für das Versenden von Antworten auf Einreichungen.
  - name: Antwort empfangen
    description: Diese Gruppe umfasst alle Endpunkte für das Empfangen von Antworten auf Einreichungen.
  - name: Fachlich
    description: Unter dieser Gruppe sind alle Endpunkte organisiert, die fachliche Informationen über die Instanz des Zustelldienstes liefern.
  - name: Internal
    description: Unter dieser Gruppe werden Endpunkte gelistet, die FIT-Connect intern sind und API-Clients nicht zur Verfügung stehen.
  - name: Vorgangsverwaltung
    description: Unter dieser Gruppe sind alle Endpunkte organisiert, die sich auf einen Vorgang (Case) in beziehen.
  - name: Webhooks
    description: Webhooks (Callbacks), über die FIT-Connect sendende und empfangende Systeme über Ereignisse benachrichtigt.
externalDocs:
  description: FIT-Connect-Dokumentationsportal mit Dokumentation zur API-Nutzung
  url: https://docs.fitko.de/fit-connect
paths:
  /v3/destinations/{destinationId}:
    parameters:
      - $ref: '#/components/parameters/destinationId'
    get:
      operationId: get-destination-info
      summary: Zustellpunkt abfragen
      description: |
        Ruft die öffentlichen Details eines Zustellpunktes ab.
      tags:
        - Einreichungsübermittlung
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination-public'
              examples:
                Beispiel-Public:
                  $ref: '#/components/examples/destination-public'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/destinations/{destinationId}/keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/destinationId'
      - $ref: '#/components/parameters/keyId'
    get:
      operationId: get-destination-key
      summary: Ruft einen JWK des Zustelldienstes ab
      description: |
        Ermöglicht es, einen öffentlichen Schlüssel eines Zustellpunktes abzufragen. Randbemerkung: Dieser Endpunkt hat ein exaktes Pendant in der Destination API. Er ist dupliziert, weil die unterschiedlichen Zielgruppen der APIs beide einen solchen Endpunkt benötigen.
      tags:
        - Einreichungsübermittlung
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jwk'
              examples:
                Beispiel Signatur-Public-Key:
                  $ref: '#/components/examples/jwk-verify'
                Beispiel Verschlüsselungs-Public-Key:
                  $ref: '#/components/examples/jwk-wrapKey'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/limits/{fromDestinationId}/{toDestinationId}:
    parameters:
      - $ref: '#/components/parameters/fromDestinationId'
      - $ref: '#/components/parameters/toDestinationId'
    get:
      operationId: get-destination-limits
      summary: Ruft Attachment-Limits ab, die für das Senden von Einreichungen oder Antworten von fromDestinationId zu toDestinationId gelten.
      description: |
        Dieser Endpunkt liefert die geltenden Limits für das Senden von Einreichungen (Submissions) oder Antworten (Replies) von einem Zustellpunkt zu einem anderen. Die Limits sind unabhängig von den Clients, die verwendet werden, und unabhängig davon, ob es sich um eine Einreichung oder Antwort handelt. Das Feld `applicable` gibt dabei das tatsächlich geltende Limit an. Die anderen Werte haben nur eine erläuternde Funktion. Sie geben das Zustandekommen von `applicable` an, was schlichtweg das Minimum der anderen Werte darstellt.
      tags:
        - Einreichungsübermittlung
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attachment-limits'
              examples:
                Beispiel:
                  $ref: '#/components/examples/attachment-limits'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/search-destinations/by-process-message:
    get:
      operationId: search-destinations-by-process-message
      summary: Suche von Zustellpunkten anhand von processModelId, messageId und Region.
      tags:
        - Search
      description: |
        Dieser Endpunkt bietet Clients die Möglichkeit, nach Zustellpunkten mittels processModelId, messageId und Region zu suchen.
      security: []
      parameters:
        - $ref: '#/components/parameters/process-model-id'
        - $ref: '#/components/parameters/message-id'
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/destination-public-list'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/cases/{caseId}/events:
    parameters:
      - $ref: '#/components/parameters/caseId'
    get:
      operationId: get-case-events
      summary: Event Log auslesen
      description: |
        Über diesen Endpunkt kann der [Event Log](https://docs.fitko.de/fit-connect/docs/getting-started/event-log/overview) eines Vorgangs abgerufen werden, um z.B. den Status des Vorgangs zu überprüfen. Die Einträge haben eine stabile, aber nicht näher spezifizierte Reihenfolge.
      tags:
        - Vorgangsverwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
            - https://schema.fitko.de/fit-connect/oauth/scopes/read-all-event-logs
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/submissionIdInQuery'
        - $ref: '#/components/parameters/replyIdInQuery'
        - $ref: '#/components/parameters/eventTypeInQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event-log'
              examples:
                Beispiel:
                  $ref: '#/components/examples/event-log'
        default:
          $ref: '#/components/responses/detailed-error'
    post:
      operationId: send-case-event
      summary: Event senden
      description: |
        Als empfangendes System ist es notwendig die Einreichung entweder zu akzeptieren oder abzulehnen und dadurch die Zustellung abzuschließen. Hierfür muss ein entsprechendes Event im Vorgang hinterlegt werden, indem es den Zustelldienst gesendet wird. Dieses Event kann nach der Validierung der Rahmenstruktur der Einreichung versendet werden, wie [hier](https://docs.fitko.de/fit-connect/docs/receiving/process-and-acknowledge) beschrieben ist.
      tags:
        - Vorgangsverwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              $ref: '#/components/schemas/security-event-token'
            examples:
              Beispiel:
                $ref: '#/components/examples/security-event-token'
      responses:
        '204':
          description: 'No Content: Security Event Token angenommen'
        '409':
          $ref: '#/components/responses/conflict'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/caseId'
    get:
      summary: Vorgang abrufen
      operationId: get-case
      description: |
        Mit diesem Endpunkt kann ein Vorgang abgerufen werden.
      tags:
        - Vorgangsverwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case'
              examples:
                Vorgang:
                  $ref: '#/components/examples/case'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/cases:
    get:
      operationId: get-cases
      summary: Vorgänge auflisten
      description: |
        Mit diesem Request werden alle Vorgänge aufgelistet. Die Vorgänge werden anhand des Zeitpunktes der Erzeugung aufsteigend sortiert. Bei Autorisierung als Onlinedienst (`sender`) werden alle Vorgänge gelistet, die vom API-Client auf Basis der OAuth Client-ID initiiert wurden. Bei Autorisierung als Fachverfahren (`subscriber`) werden alle Vorgänge gelistet, die an dessen Destination-ID gesendet wurden.
      tags:
        - Vorgangsverwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-cases'
              examples:
                Beispiel:
                  $ref: '#/components/examples/list-cases'
        default:
          $ref: '#/components/responses/detailed-error'
    post:
      operationId: post-case
      summary: Vorgang explizit anlegen
      description: |
        Mit der ersten Submission ohne Case-Bezug wird automatisch ein Case angelegt. Es ist aber auch möglich, einen Case zuvor explizit mit Hilfe dieses Endpunkts anzulegen.
      tags:
        - Vorgangsverwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-case'
            examples:
              Beispiel:
                $ref: '#/components/examples/create-case'
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              $ref: '#/components/headers/cache-control-no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/case'
              examples:
                Beispiel:
                  $ref: '#/components/examples/case'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/replies:
    get:
      operationId: get-replies-for-pickup
      summary: Abholbereite (Status SUBMITTED) Antworten auflisten
      description: |
        Mit diesem Request werden alle abholbereiten Antworten aufgelistet. Die Antworten werden anhand des Zeitpunktes der Erzeugung aufsteigend sortiert. Mit dem optionalen 'destinationId' Parameter können die Antworten zudem anhand des adressierten Zustellpunktes gefiltert werden.
      tags:
        - Antwort empfangen
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      parameters:
        - $ref: '#/components/parameters/destinationIdInQuery'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/replies-for-pickup'
              examples:
                Beispiel:
                  $ref: '#/components/examples/replies-for-pickup'
        default:
          $ref: '#/components/responses/detailed-error'
    post:
      operationId: create-reply
      summary: Antwort erstellen
      description: |
        Über diesen Endpunkt kann das empfangende System dem sendenden System eine Antwort zukommen zu lassen. Empfänger der Antwort ist immer der Zustellpunkt, der den Vorgang angelegt hat (`fromDestinationId` des Vorgangs). Antworten sind nur möglich, wenn dieser Zustellpunkt vom Typ `C` (Onlinedienst) ist; Zustellpunkte vom Typ `A` oder `B` (Fachverfahren) können keine Antworten empfangen.
      tags:
        - Antwort senden
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-reply'
            examples:
              Beispiel:
                $ref: '#/components/examples/create-reply'
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reply-created'
              examples:
                Beispiel:
                  $ref: '#/components/examples/reply-created'
        '422':
          $ref: '#/components/responses/unprocessable-entity'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/replies/{replyId}:
    parameters:
      - $ref: '#/components/parameters/replyId'
    get:
      operationId: get-reply
      summary: Antwort abrufen
      description: |
        Hierüber können die Fachdaten, Metadaten und Strukturinformation einer Antwort abgefragt und dann ausgewertet werden. Eine Beschreibung, wie diese Daten weiter verarbeitet werden, ist in der Dokumentation zu finden.
      tags:
        - Antwort empfangen
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reply'
              examples:
                Beispiel:
                  $ref: '#/components/examples/reply'
        default:
          $ref: '#/components/responses/detailed-error'
    put:
      operationId: submit-reply
      summary: Antwort versenden
      description: |
        Mit der Übermittlung der Meta- und Fachdaten wird die Antwort an das sendende System (Empfänger der Antwort) abgesendet. Im Ereignisprotokoll (event log) des zugehörigen Vorgangs (case) kann geprüft werden, ob die Antwort den Empfänger erreicht hat bzw. von diesem akzeptiert wurde.
      tags:
        - Antwort senden
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submit-reply'
            examples:
              Beispiel:
                $ref: '#/components/examples/submit-submission'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reply-reduced'
              examples:
                Beispiel:
                  $ref: '#/components/examples/reply-reduced'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/replies/{replyId}/accept:
    parameters:
      - $ref: '#/components/parameters/replyId'
    put:
      summary: Rückantwort akzeptieren
      description: |
        Mit der Übermittlung der empfangenen Authentication-Tags wird der Empfang der Antwort dokumentiert. Sofern die Antwort trotz Fehlern empfangen wurde, können diese in der Liste `problems` protokolliert werden.
      tags:
        - Antwort empfangen
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      operationId: put-reply-accept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/event-payload-accept-reply'
            examples:
              Einfaches Beispiel:
                $ref: '#/components/examples/accept-reply'
              Beispiel mit Problemen:
                $ref: '#/components/examples/accept-reply-with-nonfatal-problems'
      responses:
        '200':
          description: OK
          content:
            application/jose:
              schema:
                $ref: '#/components/schemas/security-event-token'
              examples:
                Beispiel:
                  $ref: '#/components/examples/security-event-token'
        '409':
          $ref: '#/components/responses/conflict'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/replies/{replyId}/reject:
    parameters:
      - $ref: '#/components/parameters/replyId'
    put:
      summary: Rückantwort ablehnen
      description: |
        Konnte die Antwort wegen technischen Fehlern nicht empfangen werden, so wird sie zurückgewiesen. Die Fehler werden in der Liste `problems` protokolliert.
      tags:
        - Antwort empfangen
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      operationId: put-reply-reject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/event-payload-reject'
            examples:
              Beispiel:
                $ref: '#/components/examples/reject-reply'
      responses:
        '200':
          description: OK
          content:
            application/jose:
              schema:
                $ref: '#/components/schemas/security-event-token'
              examples:
                Beispiel:
                  $ref: '#/components/examples/security-event-token'
        '409':
          $ref: '#/components/responses/conflict'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/replies/{replyId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/replyId'
      - $ref: '#/components/parameters/attachmentId'
    get:
      operationId: get-reply-attachment
      summary: Anlage einer Antwort abrufen
      description: |
        Ruft eine Anlage einer Einreichung im JOSE-Format ab. Genaueres ist in der Dokumentation beschrieben.
      tags:
        - Antwort empfangen
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      responses:
        '200':
          description: OK
          content:
            application/jose:
              schema:
                $ref: '#/components/schemas/jwe'
              examples:
                Beispiel:
                  $ref: '#/components/examples/encrypted-message'
        default:
          $ref: '#/components/responses/detailed-error'
    put:
      operationId: add-reply-attachment
      summary: Anlage einer Antwort hinzufügen
      description: |
        Hochladen der in `announcedAttachments` angekündigten Anlage im JOSE-Format unter der mitgeteilten UUID. Genaueres ist in der Dokumentation beschrieben.
      tags:
        - Antwort senden
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              $ref: '#/components/schemas/jwe'
            examples:
              Beispiel:
                $ref: '#/components/examples/encrypted-message'
      responses:
        '204':
          description: 'No Content: Anlage erfolgreich hinzugefügt/überschrieben'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/replies/{replyId}/events:
    parameters:
      - $ref: '#/components/parameters/replyId'
    get:
      operationId: get-reply-events
      summary: Event Log für Antwort auslesen
      description: |
        Über diesen Endpunkt kann das [Event Log](https://docs.fitko.de/fit-connect/docs/getting-started/event-log/overview) zu einer Antwort abgerufen werden. Die Einträge haben eine stabile, aber nicht näher spezifizierte Reihenfolge.
      tags:
        - Vorgangsverwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
            - https://schema.fitko.de/fit-connect/oauth/scopes/read-all-event-logs
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event-log'
              examples:
                Beispiel:
                  $ref: '#/components/examples/event-log'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/submissions:
    get:
      operationId: get-submissions-for-pickup
      summary: Abholbereite (Status SUBMITTED) Einreichungen auflisten
      description: |
        Mit diesem Request werden alle abholbereiten Einreichungen sowie deren Zustellpunkte aufgelistet. Die Einreichungen haben eine stabile Reihenfolge und sind nach dem Zeitpunkt der letzten Statusänderung sortiert.
      tags:
        - Einreichungsempfang
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      parameters:
        - $ref: '#/components/parameters/destinationIdInQuery'
        - $ref: '#/components/parameters/public-service'
          required: false
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submissions-for-pickup'
              examples:
                Beispiel:
                  $ref: '#/components/examples/submissions-for-pickup'
        default:
          $ref: '#/components/responses/detailed-error'
    post:
      operationId: create-submission
      summary: Einreichung erstellen
      description: |
        Dieser Endpunkt ist der erste, initiale Schritt zum Erstellen einer Einreichung. Danach können Anlagen hochgeladen und schließlich die Einreichung an den Zustellpunkt versendet werden, der in diesem Endpunkt angegeben wurde.
      tags:
        - Einreichungsübermittlung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/create-submission'
                - $ref: '#/components/schemas/create-submission-with-process'
            examples:
              Beispiel:
                $ref: '#/components/examples/create-submission'
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/location'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/submission-created'
                  - $ref: '#/components/schemas/submission-created-with-process'
              examples:
                Beispiel:
                  $ref: '#/components/examples/submission-created'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/submissions/{submissionId}:
    parameters:
      - $ref: '#/components/parameters/submissionId'
    get:
      operationId: get-submission
      summary: Einreichung abrufen
      description: |
        Hierüber können die Fachdaten, Metadaten und Strukturinformation einer Einreichung vom Status submitted oder forwarded abgefragt und dann ausgewertet werden. Eine Beschreibung, wie diese Daten weiter verarbeitet werden ist [hier](https://docs.fitko.de/fit-connect/docs/receiving/download-submission) zu finden.
      tags:
        - Einreichungsempfang
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/submission'
                  - $ref: '#/components/schemas/submission-with-process'
              examples:
                Beispiel:
                  $ref: '#/components/examples/submission'
        default:
          $ref: '#/components/responses/detailed-error'
    put:
      operationId: submit-submission
      summary: Einreichung versenden
      description: |
        Über den Aufruf dieses Endpunktes wird eine vollständige Einreichung an den Zustellpunkt versendet. Als sendendes System kann der Status der Einreichung überprüft werden, um herauszufinden, ob die Einreichung den Zustellpunkt erreicht hat bzw. von diesem akzeptiert wurde.
      tags:
        - Einreichungsübermittlung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submit-submission'
            examples:
              Beispiel:
                $ref: '#/components/examples/submit-submission'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/submission-created'
                  - $ref: '#/components/schemas/submission-created-with-process'
              examples:
                Beispiel:
                  $ref: '#/components/examples/submission-submitted'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/submissions/{submissionId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/submissionId'
      - $ref: '#/components/parameters/attachmentId'
    get:
      operationId: get-submission-attachment
      summary: Anlage abrufen
      description: |
        Ruft eine Anlage einer Einreichung vom Status submitted oder forwarded im JOSE-Format ab. Genaueres ist in der [Dokumentation](https://docs.fitko.de/fit-connect/docs/receiving/download-submission) beschrieben
      tags:
        - Einreichungsempfang
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
      responses:
        '200':
          description: OK
          content:
            application/jose:
              schema:
                $ref: '#/components/schemas/jwe'
              examples:
                Beispiel:
                  $ref: '#/components/examples/encrypted-message'
        default:
          $ref: '#/components/responses/detailed-error'
    put:
      operationId: add-submission-attachment
      summary: Anlage hinzufügen
      description: |
        Hochladen der in `announcedAttachments` angekündigten Anlage im JOSE-Format unter der mitgeteilten UUID. Anlagen sind mit dem gültigen Verschlüsselungsschlüssel der Destination (referenziert im Attribut `encryptionKid` der Destination) zu verschlüsseln. Genaueres ist [in der Dokumentation](https://docs.fitko.de/fit-connect/docs/sending/attachments) beschrieben.
      tags:
        - Einreichungsübermittlung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              $ref: '#/components/schemas/jwe'
            examples:
              Beispiel:
                $ref: '#/components/examples/encrypted-message'
      responses:
        '204':
          description: 'No Content: Anlage erfolgreich hinzugefügt/überschrieben'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/submissions/{submissionId}/events:
    parameters:
      - $ref: '#/components/parameters/submissionId'
    get:
      operationId: get-submission-events
      summary: Event Log für Einreichung auslesen
      description: |
        Über diesen Endpunkt kann das [Event Log](https://docs.fitko.de/fit-connect/docs/getting-started/event-log/overview) zu einer Einreichung abgerufen werden. Die Einträge haben eine stabile, aber nicht näher spezifizierte Reihenfolge.
      tags:
        - Vorgangsverwaltung
      security:
        - OAuth2:
            - https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations
            - https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions
            - https://schema.fitko.de/fit-connect/oauth/scopes/read-all-event-logs
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event-log'
              examples:
                Beispiel:
                  $ref: '#/components/examples/event-log'
        default:
          $ref: '#/components/responses/detailed-error'
  /v3/info:
    get:
      operationId: get-info
      summary: Rufe die Version der bereitgestellten Submission API ab
      description: Für Debugging oder Informationszwecke angebotener Endpunkt
      tags:
        - Fachlich
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/info'
              examples:
                Beispiel:
                  $ref: '#/components/examples/info'
        default:
          $ref: '#/components/responses/detailed-error'
  /.well-known/jwks.json:
    get:
      operationId: get-jwks.json
      summary: Rufe die öffentlichen Schlüssel des Zustelldienstes ab
      description: Kann z.B. zur Validierung der SETs des Zustelldienstes genutzt werden.
      tags:
        - Fachlich
      security: []
      responses:
        '200':
          description: OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/access-control-allow-origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jwks'
              examples:
                Beispiel:
                  $ref: '#/components/examples/jwks-verify'
        default:
          $ref: '#/components/responses/detailed-error'
webhooks:
  new-events:
    post:
      summary: Webhook für neue Events im Event Log
      description: |
        Bei neuen Events im Event Log werden (je nach Event-Typ) sowohl einreichende als auch empfangende Systeme mit Hilfe dieses Webhooks benachrichtigt. Voraussetzung für einreichende Systeme ist die vorherige Konfiguration des Webhooks mit `url` und `secret` beim Senden der Einreichung. Voraussetzung für empfangende Systeme ist die vorherige Konfiguration der [Callback-URL](https://docs.fitko.de/fit-connect/docs/details/callbacks) beim Anlegen des Zustellpunkts.
      operationId: webhook-new-events
      parameters:
        - $ref: '#/components/parameters/hmac-cb-authentication'
        - $ref: '#/components/parameters/hmac-cb-timestamp'
      security: []
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-events'
      responses:
        '200':
          description: OK
  new-replies:
    post:
      summary: Webhook für eine neue Antwort
      description: |
        Bei neuen Antworten wird das sendende System der Einreichung mit Hilfe dieses Webhooks benachrichtigt. Voraussetzung ist die vorherige Konfiguration des Webhooks mit `url` und `secret` beim Senden der Einreichung.
      operationId: webhook-new-replies
      parameters:
        - $ref: '#/components/parameters/hmac-cb-authentication'
        - $ref: '#/components/parameters/hmac-cb-timestamp'
      security: []
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-replies'
      responses:
        '200':
          description: OK
  new-submissions:
    post:
      summary: Webhook für eine neue Einreichung
      description: |
        Bei neuen Einreichungen wird das empfangende System mit Hilfe dieses Webhooks benachrichtigt. Voraussetzung ist die vorherige Konfiguration der [Callback-URL](https://docs.fitko.de/fit-connect/docs/details/callbacks) beim Anlegen des Zustellpunkts.
      operationId: webhook-new-submissions
      parameters:
        - $ref: '#/components/parameters/hmac-cb-authentication'
        - $ref: '#/components/parameters/hmac-cb-timestamp'
      security: []
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-submissions'
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    OAuth2:
      description: Authentifizierungsmethode, um den Zugriff nach RFC8725 zu autorisieren
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth-testing.fit-connect.fitko.dev/token
          scopes:
            https://schema.fitko.de/fit-connect/oauth/scopes/subscribe-destinations: Erlaubt den Abruf von Einreichungen
            https://schema.fitko.de/fit-connect/oauth/scopes/manage-destinations: Erlaubt die Verwaltung von Zustellpunkten
            https://schema.fitko.de/fit-connect/oauth/scopes/send-submissions: Erlaubt das Versenden von Einreichungen an Zustellpunkte
    InternalOAuth2:
      description: Authentifizierungsmethode, um den Zugriff nach RFC8725 zu autorisieren. Nur für Wartungszwecke.
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth-testing.fit-connect.fitko.dev/token
          scopes:
            https://schema.fitko.de/fit-connect/oauth/scopes/read-all-event-logs: Erlaubt das Lesen von Event Logs. Nur für Wartungszwecke.
  parameters:
    destinationId:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 32
        maxLength: 36
      description: Die UUID des Zustellpunktes
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
      description: Die Id eines JWK
    fromDestinationId:
      name: fromDestinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 32
        maxLength: 36
      description: Die UUID des Zustellpunktes, der die Einreichung oder Antwort sendet
    toDestinationId:
      name: toDestinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 32
        maxLength: 36
      description: Die UUID des Zustellpunktes, der die Einreichung oder Antwort empfängt
    process-model-id:
      name: processModelId
      in: query
      required: true
      schema:
        title: Prozessreferenz
        description: |
          URI einer Prozessdefinition, z.B. `https://schema.example.com/foo/bar.bpmn` oder `bpmn:960116c1-f862-4060-beaa-f99e410f8325:v2`.
        type: string
        format: uri
        maxLength: 512
        example: https://schema.example.com/foo/bar.bpmn
    message-id:
      name: messageId
      in: query
      required: true
      schema:
        title: messageId
        description: |
          ID eines Prozessschrittes innerhalb des durch `processModelId` definierten Prozesses.
        type: string
        maxLength: 255
        example: 172ff473-ef69-4ce6-a8d6-a50308e355e3
    region:
      name: region
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/service-region'
      description: Zustellpunkte anhand ihrer Region filtern
    limit:
      name: limit
      in: query
      description: Anzahl der zurückzugebenden Ergebnisse. Maximum ist 500. Standard ist 100.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
    offset:
      name: offset
      in: query
      description: Startposition der Teilmenge zurückzugebender Ergebnisse aus der Gesamtergebnismenge. Standard ist 0.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 32
        maxLength: 36
      description: Die UUID des Vorgangs
    submissionIdInQuery:
      name: submissionId
      in: query
      schema:
        $ref: '#/components/schemas/schema'
      description: Die UUID der Einreichung, nach der die Events gefiltert werden sollen.
    replyIdInQuery:
      name: replyId
      in: query
      schema:
        $ref: '#/components/schemas/schema'
      description: Die UUID der Antwort, nach der die Events gefiltert werden sollen.
    eventTypeInQuery:
      name: event
      in: query
      required: false
      schema:
        type: string
      description: Filtert nach Event(-typ). Mögliche Abfragen sind zum Beispiel "?sub=create-submission", oder aber "?sub=submit-submission&sub=accept-submission&sub=reject-submission".
    destinationIdInQuery:
      name: destinationId
      in: query
      schema:
        $ref: '#/components/schemas/schema'
      description: Die UUID des Zustellpunktes
    replyId:
      name: replyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 32
        maxLength: 36
      description: Die UUID der Antwort
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 32
        maxLength: 36
      description: Die UUID der Anlage. Wird vom Client erstellt, um auf diese z. B. in den Fachdaten zu referenzieren.
    public-service:
      name: publicService
      in: query
      description: Zustellpunkte oder Einreichungen anhand der unterstützten Verwaltungsleistung filtern
      schema:
        type: string
        title: Leistungsidentifikator
        description: |
          URN einer Leistung. Im Falle einer Leistung aus dem Leistungskatalog sollte hier `urn:de:fim:leika:leistung:` vorangestellt werden.
        minLength: 7
        maxLength: 255
        pattern: ^urn:[a-z0-9][a-z0-9-]{0,31}:[a-z0-9()+,.:=@;$_!*'%/?#-]+$
        example: urn:de:fim:leika:leistung:99400048079000
    submissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 32
        maxLength: 36
      description: Die UUID der Einreichung
    hmac-cb-authentication:
      in: header
      name: Callback-Authentication
      required: true
      description: Der Message Authentication Code des übertragenen Callbacks.
      schema:
        type: string
    hmac-cb-timestamp:
      in: header
      name: Callback-Timestamp
      required: true
      description: Der Timestamp des Message Authentication Code.
      schema:
        type: integer
  schemas:
    problem:
      title: Fehler
      type: object
      description: Der Inhalt von HTTP Responses bei Fehlern nach RFC7807.
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: Eine URI-Referenz, die den Problemtyp identifiziert.
        title:
          type: string
          description: Eine kurze, von Menschen lesbare Zusammenfassung des Problems.
        status:
          type: integer
          description: Der HTTP-Statuscode der vom Ursprungsserver für dieses Auftreten des Problems generiert wurde.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Eine von Menschen lesbare Erklärung speziell für dieses Auftreten des Problems.
        instance:
          type: string
          format: uri
          description: |
            Eine URI-Referenz, die das spezifische Auftreten des Problems identifiziert. Sie kann, muss aber nicht, weitere Informationen liefern, wenn sie dereferenziert wird.
        errorcode:
          type: string
          description: Eine eindeutige ID dieses Fehlerfalls, die bei Support-Anfragen hilfreich sein kann.
        violations:
          type: array
          description: Bei nicht-schemakonformen Requests finden sich hier in der Regel Details zu abgelehnten Datenfeldern.
          items:
            type: string
        issue:
          type: string
          description: Bei invalidem Input kann dieses Feld weitere Hinweise enthalten und somit die Fehlersuche erleichtern.
    supported-metadata-versions:
      title: Liste unterstützter Metadatenschemataversionen
      description: Eine Liste unterstützter Versionen des Metadatenschemas gemäß [Semantic Versioning](https://semver.org/).
      type: array
      uniqueItems: true
      minItems: 1
      items:
        type: string
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
    service-region:
      title: Region
      type: string
      description: Amtlicher Regionalschlüssel (ARS), vorangestellt mit 'DE'.
      minLength: 2
      maxLength: 14
      pattern: ^DE[0-9]{0,12}$
      example: DE094750156156
    submission-schema:
      title: Fachdatenschema
      description: Referenz auf ein Schema, das die Struktur der Fachdaten einer Einreichung beschreibt.
      type: object
      required:
        - mimeType
        - schemaUri
      properties:
        mimeType:
          type: string
          description: Mimetype (z.B. application/json oder application/xml) des referenzierten Schemas (z.B. XSD- oder JSON-Schema).
          enum:
            - application/json
            - application/xml
        schemaUri:
          type: string
          format: uri
          description: |
            URI des Fachschemas. Wird hier eine URL verwendet, sollte das Schema unter der angegebenen URL abrufbar sein. Eine Verfügbarkeit des Schemas unter der angegebenen URL darf jedoch nicht vorausgesetzt werden.
    destination-process-message:
      title: Unterstütze Prozessnachricht
      description: Beschreibt einen Nachrichtenfluss, der von diesem Zustellpunkt empfangen werden kann.
      type: object
      required:
        - processModelId
        - messageId
        - regions
        - schemas
      properties:
        processModelId:
          description: |
            URI einer Prozessdefinition, z.B. `https://schema.example.com/foo/bar.bpmn` oder `bpmn:960116c1-f862-4060-beaa-f99e410f8325:v2`.
          type: string
          maxLength: 512
          example: https://schema.example.com/foo/bar.bpmn
        messageId:
          description: |
            ID eines Prozessschrittes innerhalb des durch `processModelId` definierten Prozesses.
          type: string
          maxLength: 255
          example: 172ff473-ef69-4ce6-a8d6-a50308e355e3
        regions:
          description: |
            Amtliche Regionalschlüssel (ARS) der Regionen in denen ein Empfang dieser Prozessnachricht angeboten wird. Vorangestellt mit 'DE'.
          uniqueItems: true
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/service-region'
        schemas:
          title: Unterstützte Fachschemata
          description: Auflistung aller unterstützten Fachschemata, in denen Prozessnachrichten dieses Typs empfangen werden können.
          uniqueItems: true
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/submission-schema'
    reply-channels:
      type: object
      description: |
        Hier kann eine empfangende Stelle angeben, welche Rückkanäle es für Einreichungen an diesen Zustellpunkt unterstützt. Sofern keine Reply Channels angegeben werden, kann ein sendendes System davon ausgehen, dass die Behörde nur über den Papierweg im Rückkanal kommuniziert.
      minProperties: 1
      properties:
        eMail:
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per E-Mail unterstützt.
          type: object
          properties:
            usePgp:
              type: boolean
              description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für die Rückkanalkommunikation per E-Mail eine Verschlüsselung mit PGP unterstützt, sofern eine PGP Schlüssel über die Metadaten der Einreichung oder einen anderen Mechanismus übermittelt wurden.
        deMail:
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per DE-Mail unterstützt.
        fink:
          deprecated: true
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation an die interoperablen Postfächer der FINK Föderation unterstützt.
        elster:
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per Elster-Transfer unterstützt.
        fitConnect:
          type: object
          description: Hiermit kann den sendenden Systemen signalisiert werden, dass die empfangende Stelle für Einreichungen an diesen Zustellpunkt eine Rückkanalkommunikation per FIT-Connect unterstützt.
          required:
            - processStandards
          properties:
            processStandards:
              description: |
                Hier ist eine eindeutige Referenz auf den zu verwendenden Datenaustauschstandard (einschließlich der Version) mittels der offiziellen URI des Datenaustauschstandards zu hinterlegen.
              type: array
              minItems: 1
              items:
                type: string
                format: uri
        idBundDeMailbox:
          type: object
          description: Hiermit kann dem Onlinediensten signalisiert werden, dass das Verwaltungssystem das zentrale Bürgerpostfach der DeutschlandID unterstützt.
          required:
            - useStatusMonitor
          properties:
            useStatusMonitor:
              type: boolean
              description: Hiermit signalisiert das Verwaltungssystem, dass es den Statusmmonitor der DeutschlandID nutzt und der Onlinedienst einen Status anlegen darf.
    destination-service:
      title: Verwaltungsleistung
      description: Verwaltungsleistung, die eine Destination anbietet.
      type: object
      required:
        - identifier
        - regions
        - submissionSchemas
      properties:
        identifier:
          title: Leistungs-Identifikator
          description: |
            URN einer Leistung. Im Falle einer Leistung aus dem Leistungskatalog sollte hier `urn:de:fim:leika:leistung:` vorangestellt werden.
          type: string
          minLength: 7
          maxLength: 255
          pattern: ^urn:[a-z0-9][a-z0-9-]{0,31}:[a-z0-9()+,.:=@;$_!*'%/?#-]+$
        regions:
          description: |
            Amtliche Regionalschlüssel (ARS) der Regionen in denen die Leistung angeboten wird. Vorangestellt mit 'DE'.
          uniqueItems: true
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/service-region'
        replyChannels:
          $ref: '#/components/schemas/reply-channels'
        submissionSchemas:
          title: Unterstützte Fachschemata
          description: Auflistung aller unterstützten Fachschemata des Zustellpunktes.
          uniqueItems: true
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/submission-schema'
    destination-status:
      type: string
      enum:
        - created
        - active
        - inactive
        - decommissioned
      description: Status des Zustellpunktes. Eine Beschreibung der Status finden Sie in den Detailinformationen unter [Zustellpunktverwaltung](https://docs.fitko.de/fit-connect/docs/details/destination-management).
    destination-type:
      type: string
      enum:
        - A
        - B
        - C
      description: Der Typ eines Zustellpunktes
    client-id:
      type: string
      format: uuid
      minLength: 32
      maxLength: 36
      description: Die UUID eines Clients
    destination-sender-access-restricted:
      type: object
      required:
        - enabled
        - allowedSenders
        - allowedSenderDestinations
      properties:
        enabled:
          type: boolean
          description: |
            Gibt an, ob das Senden an diesen Zustellpunkt beschränkt ist oder nicht.
            Falls `true` dürfen ausschließlich Clients, deren ID in `allowedSenders` enthalten ist,
            oder Zustellpunkte, deren ID in `allowedSenderDestinations` enthalten ist,
            an diesen Zustellpunkt senden.
        allowedSenders:
          deprecated: true
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/client-id'
          description: |
            **Deprecated** – Dieses Feld wird in der nächsten Major-Version entfernt.
            Auflistung der Client-IDs, die an diesen Zustellpunkt senden dürfen.
            Die Clients müssen existieren und vom Typ `SENDER` sein.
            Über V3 können keine neuen Einträge hinzugefügt werden; bestehende Einträge können entfernt werden.
        allowedSenderDestinations:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
            description: Die UUID eines Zustellpunktes
          description: |
            Auflistung der Zustellpunkt-IDs, die an diesen Zustellpunkt senden dürfen.
    destination-public:
      title: Zustellpunkt
      description: Öffentliche Daten eines Zustellpunktes
      type: object
      required:
        - destinationId
        - metadataVersions
        - status
        - type
      properties:
        destinationId:
          type: string
          minLength: 32
          format: uuid
          maxLength: 36
          description: Identifikator des Zustellpunktes im Format einer UUID
        encryptionKid:
          type: string
          minLength: 8
          maxLength: 64
          description: |
            Key-ID des Verschlüsselungsschlüssels der Destination. Zu finden in der Subressource `keys/<keyId>`.
        metadataVersions:
          $ref: '#/components/schemas/supported-metadata-versions'
        processMessages:
          title: Prozessverarbeitungsleistungen
          description: Eine Liste unterstützter Prozessnachrichten des Zustellpunktes.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/destination-process-message'
        publicServices:
          title: Unterstützte Verwaltungsleistungen
          description: Auflistung aller unterstützten Verwaltungsleistungen des Zustellpunktes.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/destination-service'
        status:
          $ref: '#/components/schemas/destination-status'
        type:
          $ref: '#/components/schemas/destination-type'
        senderAccessRestricted:
          $ref: '#/components/schemas/destination-sender-access-restricted'
    jwk:
      title: JSON Web Key (JWK)
      type: object
      description: JSON Web Key - RFC7517
      required:
        - kty
        - key_ops
        - alg
        - x5c
        - kid
        - 'n'
        - e
      properties:
        kty:
          type: string
          description: |
            Der Parameter "kty" (Schlüsseltyp) identifiziert die kryptografische Algorithmus Familie, die mit dem Schlüssel verwendet wird, z. B. "RSA" oder "EC". In FIT-Connect sind aktuell nur RSA-Schlüssel erlaubt.
          enum:
            - RSA
        key_ops:
          type: array
          description: |
            Der Parameter "key_ops" (Schlüsseloperationen) identifiziert die Operation(en) für die der Schlüssel verwendet werden soll. Die Bedeutung der Erlaubten Operationen sind:
              - `verify`: Digitale Signatur oder MAC überprüfen
              - `wrapKey`: Verschlüsselungsschlüssel
          items:
            type: string
            enum:
              - verify
              - wrapKey
        alg:
          type: string
          description: |
            Der Parameter "alg" (Algorithmus) identifiziert den Algorithmus, der für Verwendung mit dem Schlüssel vorgesehen ist. In FIT-Connect wird `PS512` für Signaturschlüssel und `RSA-OAEP-256` für Verschlüsselungsschlüssel genutzt.
          enum:
            - PS512
            - RSA-OAEP-256
        x5c:
          type: array
          description: |
            Der Parameter "x5c" (X.509 certificate chain) enthält eine Kette von einem oder mehreren PKIX-Zertifikaten [RFC5280]. Die Zertifikatskette wird als JSON-Array von Zertifikatswert-Strings dargestellt.
          minItems: 1
          items:
            type: string
        kid:
          type: string
          description: |
            Der Parameter "kid" (Schlüssel-Id) wird verwendet, um einen bestimmten Schlüssel zu finden. Dieser wird z. B. verwendet, um zwischen einer Reihe von Schlüsseln innerhalb eines JWK-Sets zu wählen während des Schlüssel-Rollover.
          minLength: 8
          maxLength: 64
        'n':
          type: string
          description: Modulus des Schlüssels. Die minimale Länge von 683 Zeichen repräsentiert eine Schlüssellange von mindestens 4096 Bit.
          minLength: 683
        e:
          type: string
          description: Öffentliche Exponent des Schlüssels
          enum:
            - AQAB
    attachment-limits:
      type: object
      required:
        - attachments
      properties:
        attachments:
          type: object
          required:
            - platform
            - receive
            - send
            - applicable
          properties:
            platform:
              type: object
              description: Fundamentales Limit, das unabhängig von den Beteiligten ist.
              required:
                - maxNumber
                - maxSizeIndividualBytes
                - maxSizeAggregateBytes
              properties:
                maxNumber:
                  type: integer
                  minimum: 0
                  description: Maximale Anzahl an Attachments pro Einreichung oder Antwort
                maxSizeIndividualBytes:
                  type: integer
                  minimum: 1
                  description: Maximale Dateigröße (in Bytes) eines einzelnen Attachments
                maxSizeAggregateBytes:
                  type: integer
                  minimum: 1
                  description: Maximale kumulierte Dateigröße (in Bytes) aller Attachments einer Einreichung oder Antwort
            receive:
              type: object
              description: Empfangs-Limit der toDestinationId.
              required:
                - maxNumber
                - maxSizeIndividualBytes
                - maxSizeAggregateBytes
              properties:
                maxNumber:
                  type: integer
                  minimum: 0
                  description: Maximale Anzahl an Attachments pro Einreichung oder Antwort
                maxSizeIndividualBytes:
                  type: integer
                  minimum: 1
                  description: Maximale Dateigröße (in Bytes) eines einzelnen Attachments
                maxSizeAggregateBytes:
                  type: integer
                  minimum: 1
                  description: Maximale kumulierte Dateigröße (in Bytes) aller Attachments einer Einreichung oder Antwort
            send:
              type: object
              description: Sende-Limit der fromDestinationId.
              required:
                - maxNumber
                - maxSizeIndividualBytes
                - maxSizeAggregateBytes
              properties:
                maxNumber:
                  type: integer
                  minimum: 0
                  description: Maximale Anzahl an Attachments pro Einreichung oder Antwort
                maxSizeIndividualBytes:
                  type: integer
                  minimum: 1
                  description: Maximale Dateigröße (in Bytes) eines einzelnen Attachments
                maxSizeAggregateBytes:
                  type: integer
                  minimum: 1
                  description: Maximale kumulierte Dateigröße (in Bytes) aller Attachments einer Einreichung oder Antwort
            applicable:
              type: object
              description: Tatsächlich geltendes Limit (das Minimum aus den anderen Werten).
              required:
                - maxNumber
                - maxSizeIndividualBytes
                - maxSizeAggregateBytes
              properties:
                maxNumber:
                  type: integer
                  minimum: 0
                  description: Maximale Anzahl an Attachments pro Einreichung oder Antwort
                maxSizeIndividualBytes:
                  type: integer
                  minimum: 1
                  description: Maximale Dateigröße (in Bytes) eines einzelnen Attachments
                maxSizeAggregateBytes:
                  type: integer
                  minimum: 1
                  description: Maximale kumulierte Dateigröße (in Bytes) aller Attachments einer Einreichung oder Antwort
    destination-public-list:
      title: Liste von Zustellpunkten
      type: object
      required:
        - count
        - offset
        - totalCount
        - destinations
      properties:
        count:
          type: integer
          format: int32
          description: Anzahl zurückgegebener Zustellpunkte
          maximum: 500
          minimum: 0
        offset:
          type: integer
          format: int32
          description: Startposition der Teilmenge zurückgegebener Zustellpunkte aus der Gesamtergebnismenge.
          minimum: 0
        totalCount:
          type: integer
          format: int32
          description: Gesamtanzahl der Zustellpunkte
          minimum: 0
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/destination-public'
          description: Eine Auflistung aller selbst angelegten Zustellpunkte
          maxItems: 500
          minItems: 0
    schema:
      type: string
      format: uuid
      minLength: 32
      maxLength: 36
    security-event-token:
      title: Security Event Token
      description: |
        Ein Security Event Token ist ein signiertes JWT, das verschiedene Events darstellt. Beispiel: Das Akzeptieren bzw. Ablehnen einer Einreichung. Der Aufbau und die Bedeutung der Felder sind [in der Dokumentation beschrieben](https://docs.fitko.de/fit-connect/docs/getting-started/event-log/overview).
      type: string
      pattern: \w+\.\w+\.\w+
    event-log:
      title: Event Log einer Einreichung
      description: |
        Dieses Objekt enthält den [Event Log einer Einreichung](https://docs.fitko.de/fit-connect/docs/getting-started/event-log/overview). Beispiele für Events im Event Log sind das Akzeptieren oder das Ablehnen einer Einreichung. Der Aufbau und die Bedeutung einzelner Events ist [in der Dokumentation zum Abruf von Events beschrieben](https://docs.fitko.de/fit-connect/docs/sending/accept-reject). Neue Events werden am Ende des Event Log hinzugefügt (das letzte Element im Array ist das neuste).
      type: object
      required:
        - eventLog
      properties:
        count:
          type: integer
          format: int32
          description: Anzahl zurückgegebener Events
          maximum: 500
          minimum: 0
        offset:
          type: integer
          format: int32
          description: Startposition der Teilmenge zurückgegebener Events aus der Gesamtergebnismenge.
          minimum: 0
        totalCount:
          type: integer
          format: int32
          description: Gesamtanzahl der Events
          minimum: 0
        eventLog:
          type: array
          items:
            $ref: '#/components/schemas/security-event-token'
          maxItems: 500
          minItems: 0
    from-destination-id-receive:
      type: string
      description: |
        UUID des Zustellpunktes, der als Absender auftritt.
      format: uuid
      minLength: 36
      maxLength: 36
    service-type-get:
      type: object
      title: Verwaltungsleistung
      description: Beschreibung der Art der Verwaltungsleistung. Eine Verwaltungsleistung sollte immer mit einem LeiKa-Schlüssel beschrieben werden. Ist für die gegebene Verwaltungsleistung kein LeiKa-Schlüssel vorhanden, kann die Verwaltungsleistung übergangsweise über die Angabe einer anderen eindeutigen Schema-URN beschrieben werden.
      required:
        - identifier
      properties:
        name:
          type: string
          description: Name/Bezeichnung der Verwaltungsleistung
        description:
          type:
            - 'null'
            - string
          description: (Kurz-)Beschreibung der Verwaltungsleistung
        identifier:
          title: Leistungs-Identifikator
          description: |
            URN einer Leistung. Im Falle einer Leistung aus dem Leistungskatalog sollte hier `urn:de:fim:leika:leistung:` vorangestellt werden.
          type: string
          minLength: 7
          maxLength: 255
          pattern: ^urn:[a-z0-9][a-z0-9-]{0,31}:[a-z0-9()+,.:=@;$_!*'%/?#-]+$
    case:
      title: Vorgang
      description: |
        Beschreibt einen Vorgang (`case`), der auf einer Verwaltungsleistung (`publicService`) basiert.
      properties:
        caseId:
          $ref: '#/components/schemas/schema'
        fromDestinationId:
          $ref: '#/components/schemas/from-destination-id-receive'
        destinationId:
          $ref: '#/components/schemas/schema'
        publicService:
          $ref: '#/components/schemas/service-type-get'
      required:
        - caseId
        - destinationId
        - fromDestinationId
        - publicService
    case-minimal:
      title: Minimaler Vorgang
      required:
        - caseId
        - destinationId
        - fromDestinationId
      properties:
        caseId:
          $ref: '#/components/schemas/schema'
        fromDestinationId:
          $ref: '#/components/schemas/from-destination-id-receive'
        destinationId:
          $ref: '#/components/schemas/schema'
    list-cases:
      title: Vorgänge
      description: Vorgänge eines API-Clients oder Zustellpunktes
      type: object
      required:
        - cases
      properties:
        count:
          type: integer
          format: int32
          description: Anzahl zurückgegebener Vorgänge
          maximum: 500
          minimum: 0
        offset:
          type: integer
          format: int32
          description: Offset in die Gesamtanzahl Vorgänge
          minimum: 0
        totalCount:
          type: integer
          format: int32
          description: Gesamtanzahl Vorgänge
          minimum: 0
        cases:
          type: array
          items:
            $ref: '#/components/schemas/case-minimal'
          maxItems: 500
          minItems: 0
    from-destination-id-send:
      type: string
      description: |
        UUID des Zustellpunktes, der als Absender auftritt. Der sendende Client muss mit diesem Zustellpunkt verbunden sein. Dieses Feld ist erforderlich und kann nicht standardmäßig oder implizit abgeleitet werden.
      format: uuid
      minLength: 36
      maxLength: 36
    service-type-post:
      type: object
      title: Verwaltungsleistung
      description: Beschreibung der Art der Verwaltungsleistung. Eine Verwaltungsleistung sollte immer mit einem LeiKa-Schlüssel beschrieben werden. Ist für die gegebene Verwaltungsleistung kein LeiKa-Schlüssel vorhanden, kann die Verwaltungsleistung übergangsweise über die Angabe einer anderen eindeutigen Schema-URN beschrieben werden.
      required:
        - name
        - identifier
      properties:
        name:
          type: string
          description: Name/Bezeichnung der Verwaltungsleistung
        description:
          type: string
          description: (Kurz-)Beschreibung der Verwaltungsleistung
        identifier:
          title: Leistungs-Identifikator
          description: |
            URN einer Leistung. Im Falle einer Leistung aus dem Leistungskatalog sollte hier `urn:de:fim:leika:leistung:` vorangestellt werden.
          type: string
          minLength: 7
          maxLength: 255
          pattern: ^urn:[a-z0-9][a-z0-9-]{0,31}:[a-z0-9()+,.:=@;$_!*'%/?#-]+$
    create-case:
      title: Vorgang
      description: |
        Beschreibt einen Vorgang (`case`), der auf einer Verwaltungsleistung (`publicService`) basiert.
      properties:
        fromDestinationId:
          $ref: '#/components/schemas/from-destination-id-send'
        destinationId:
          $ref: '#/components/schemas/schema'
        publicService:
          $ref: '#/components/schemas/service-type-post'
      required:
        - fromDestinationId
        - destinationId
        - publicService
    reply-for-pickup:
      type: object
      title: Abholbereite Antworten
      description: Eine einzelne abholbereite Antwort, abzurufen beim Vorgang mit der angegebenen `caseId`.
      required:
        - replyId
        - caseId
      properties:
        replyId:
          description: Identifikator der Antwort im Format einer UUID
          $ref: '#/components/schemas/schema'
        caseId:
          description: Vorgangsreferenz des Vorgangs, zu der die Antwort gehört.
          $ref: '#/components/schemas/schema'
    replies-for-pickup:
      type: object
      title: Abholbereite Antworten
      description: Beschreibt alle abholbereiten Antworten.
      required:
        - replies
      properties:
        count:
          type: integer
          format: int32
          description: Anzahl zurückgegebener Antworten
          maximum: 500
          minimum: 0
        offset:
          type: integer
          format: int32
          description: Startposition der Teilmenge zurückgegebener Antworten aus der Gesamtergebnismenge.
          minimum: 0
        totalCount:
          type: integer
          format: int32
          description: Gesamtanzahl der abholbereiten Antworten
          minimum: 0
        replies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/reply-for-pickup'
          maxItems: 500
          minItems: 0
    process-message:
      title: Prozessverarbeitungsleistung
      description: Beschreibt den Nachrichtenfluss innerhalb eines Prozesses, den diese Nachricht abbildet.
      type: object
      required:
        - processModelId
        - messageId
      properties:
        processModelId:
          title: Prozessreferenz
          description: |
            URI einer Prozessdefinition, z.B. `https://schema.example.com/foo/bar.bpmn` oder `bpmn:960116c1-f862-4060-beaa-f99e410f8325:v2`.
          type: string
          maxLength: 512
          example: https://schema.example.com/foo/bar.bpmn
        messageId:
          title: messageId
          description: |
            ID eines Prozessschrittes innerhalb des durch `processModelId` definierten Prozesses.
          type: string
          maxLength: 255
          example: 172ff473-ef69-4ce6-a8d6-a50308e355e3
    time-to-live-reply:
      type: integer
      format: int32
      minimum: 1
      description: |
        Zeitspanne in ganzen Sekunden, nach deren Ablauf die Antwort automatisch mit dem Event `reject-reply` (Problem `time-to-live-expired`) zurückgewiesen wird, sofern der Empfänger sie bis dahin nicht angenommen hat. Die Zeit läuft ab dem Event `submit-reply`. Die Zurückweisung erfolgt zeitnah, aber nicht sekundengenau, da der Zeitpunkt vom Ausführungsintervall des Zustelldienstes abhängt; ein Accept kurz nach Ablauf der Frist kann noch erfolgreich sein. Maßgeblich für den Ausgang ist deshalb allein das eingetroffene Event, nicht der Ablauf der Frist - wer nach Fristablauf ohne `reject-reply`-Event einen anderen Zustellweg wählt, riskiert eine Doppelzustellung. Zulässig ist maximal die betrieblich konfigurierte globale Auto-Reject-Frist; höhere Werte werden mit `400` abgewiesen. Der geltende Wert ist in der [FIT-Connect-Dokumentation](https://docs.fitko.de/fit-connect/docs/getting-started/notifications-and-deletion-deadlines/) dokumentiert.
    create-reply:
      title: Objekt zum Erzeugen einer Antwort
      description: Initiales Objekt zum Erzeugen und Ankündigen einer Antwort
      type: object
      required:
        - caseId
        - fromDestinationId
        - announcedAttachments
      properties:
        fromDestinationId:
          $ref: '#/components/schemas/from-destination-id-send'
        announcedAttachments:
          type: array
          description: Eine Liste mit den `attachmentId`s die mit der Antwort hochgeladen werden sollen.
          minItems: 0
          items:
            $ref: '#/components/schemas/schema'
        caseId:
          description: Vorgangsreferenz innerhalb welcher eine neue Antwort erstellt (Reply) wird.
          $ref: '#/components/schemas/schema'
        processMessage:
          $ref: '#/components/schemas/process-message'
        timeToLive:
          $ref: '#/components/schemas/time-to-live-reply'
    reply-created:
      title: Erstellte Antwort
      description: Antwort bei erfolgreicher Erstellung einer Antwort.
      type: object
      required:
        - fromDestinationId
        - replyId
        - caseId
      properties:
        fromDestinationId:
          $ref: '#/components/schemas/from-destination-id-receive'
        replyId:
          description: Identifikator der Antwort im Format einer UUID
          $ref: '#/components/schemas/schema'
        caseId:
          description: Vorgangsreferenz des Vorgangs, zu der die Antwort gehört.
          $ref: '#/components/schemas/schema'
        processMessage:
          $ref: '#/components/schemas/process-message'
        timeToLive:
          $ref: '#/components/schemas/time-to-live-reply'
    jwe:
      title: JWE verschlüsselte Nachricht
      description: |
        Verschlüsselte Nachricht im Format JSON Web Encryption Compact Serialization (RFC7516). Wird u.a. verwendet für Fachdaten, Metadaten, Anhänge.
      type: string
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+$
      minLength: 776
    expires-at:
      type: string
      format: date-time
      description: |
        Zeitpunkt, zu dem die vom Sender mit `timeToLive` gesetzte Frist abläuft: der Zeitpunkt des Absende-Events (`submit-submission` bzw. `submit-reply`) plus `timeToLive`. Das Feld ist nur vorhanden, wenn der Sender eine Frist gesetzt hat und die Nachricht bereits abgesendet wurde. Die betrieblich konfigurierte globale Auto-Reject-Frist wird hier nicht abgebildet. Der Wert ist informativ; maßgeblich für den Ausgang der Zustellung ist allein das eingetroffene Event im Event Log.
    reply:
      title: Antwort
      description: Die Repräsentation einer Antwort
      type: object
      required:
        - replyId
        - fromDestinationId
        - caseId
        - attachments
        - encryptedMetadata
        - encryptedData
      properties:
        replyId:
          description: Identifikator der Antwort im Format einer UUID
          $ref: '#/components/schemas/schema'
        fromDestinationId:
          $ref: '#/components/schemas/from-destination-id-receive'
        caseId:
          description: ID des Vorgangs, zu dem die Antwort gehört
          $ref: '#/components/schemas/schema'
        attachments:
          type: array
          description: Liste von UUIDs der Anlagen, die bereits hochgeladen wurden
          items:
            $ref: '#/components/schemas/schema'
        encryptedMetadata:
          description: Verschlüsselte Metadaten im Format JSON Web Encryption Compact Serialization (RFC7516).
          $ref: '#/components/schemas/jwe'
        encryptedData:
          description: Verschlüsselte Fachdaten im Format JSON Web Encryption Compact Serialization (RFC7516).
          $ref: '#/components/schemas/jwe'
        processMessage:
          $ref: '#/components/schemas/process-message'
        timeToLive:
          $ref: '#/components/schemas/time-to-live-reply'
        expiresAt:
          $ref: '#/components/schemas/expires-at'
    submit-reply:
      title: Einreichung absenden
      description: Datenstruktur für den Abschluss einer Antwort.
      type: object
      required:
        - encryptedMetadata
        - encryptedData
      properties:
        encryptedMetadata:
          description: |
            Verschlüsselte Metadaten im Format JSON Web Encryption Compact Serialization (RFC7516). Die Verschlüsselung ist mit dem JWK durchzuführen, den das sendende System in der Submission mit den Metadaten übersendetet hat.
          $ref: '#/components/schemas/jwe'
        encryptedData:
          description: |
            Verschlüsselte Fachdaten im Format JSON Web Encryption Compact Serialization (RFC7516). Die Verschlüsselung ist mit dem JWK durchzuführen, den das sendende System in der Submission mit den Metadaten übersendetet hat.
          $ref: '#/components/schemas/jwe'
    reply-reduced:
      title: Antwort
      description: Die Repräsentation einer Antwort (ohne `encryptedMetadata` und `encryptedData`)
      type: object
      required:
        - replyId
        - fromDestinationId
        - caseId
        - attachments
      properties:
        replyId:
          description: Identifikator der Antwort im Format einer UUID
          $ref: '#/components/schemas/schema'
        fromDestinationId:
          $ref: '#/components/schemas/from-destination-id-receive'
        caseId:
          description: ID des Vorgangs, zu dem die Antwort gehört
          $ref: '#/components/schemas/schema'
        attachments:
          type: array
          description: Liste von UUIDs der Anlagen, die bereits hochgeladen wurden
          items:
            $ref: '#/components/schemas/schema'
        processMessage:
          $ref: '#/components/schemas/process-message'
        timeToLive:
          $ref: '#/components/schemas/time-to-live-reply'
        expiresAt:
          $ref: '#/components/schemas/expires-at'
    event-payload-problems:
      title: EventPayloadProblems
      type: array
      description: |
        Datenstruktur für problembehaftete Ereignisse. [Details sind in der Dokumentation zu finden](https://docs.fitko.de/fit-connect/docs/getting-started/event-log/events).
      items:
        type: object
        properties:
          type:
            description: Fehlercode in Form einer URI.
            type: string
            pattern: ^https:\/\/schema\.fitko\.de\/fit-connect\/events\/problems\/[-a-z]+$
          title:
            description: Für Menschen verständliche Fehlermeldung.
            type: string
          detail:
            description: Details zum Fehler, z.B. eine technische Fehlermeldung (optional)
            type: string
          instance:
