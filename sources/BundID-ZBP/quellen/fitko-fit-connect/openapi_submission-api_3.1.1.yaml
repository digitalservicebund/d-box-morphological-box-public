    time-to-live-submission:
      type: integer
      format: int32
      minimum: 1
      description: |
        Zeitspanne in ganzen Sekunden, nach deren Ablauf die Einreichung automatisch mit dem Event `reject-submission` (Problem `time-to-live-expired`) zurückgewiesen wird, sofern der Empfänger sie bis dahin nicht angenommen hat. Die Zeit läuft ab dem Event `submit-submission`. Die Zurückweisung erfolgt zeitnah, aber nicht sekundengenau, da der Zeitpunkt vom Ausführungsintervall des Zustelldienstes abhängt; ein Accept kurz nach Ablauf der Frist kann noch erfolgreich sein. Maßgeblich für den Ausgang ist deshalb allein das eingetroffene Event, nicht der Ablauf der Frist - wer nach Fristablauf ohne `reject-submission`-Event einen anderen Zustellweg wählt, riskiert eine Doppelzustellung. Zulässig ist maximal die betrieblich konfigurierte globale Auto-Reject-Frist; höhere Werte werden mit `400` abgewiesen. Der geltende Wert ist in der [FIT-Connect-Dokumentation](https://docs.fitko.de/fit-connect/docs/getting-started/notifications-and-deletion-deadlines/) dokumentiert.
